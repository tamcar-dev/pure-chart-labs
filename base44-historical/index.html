  box.appendChild(el('div', { class: 'mdfoot' },
    el('span', { style: 'font-size:11px; color: var(--faint);' }, 'PureChart — single-file build'),
    el('span', { class: 'spacer' }),
    el('button', { class: 'btn primary', onclick: closeModal }, 'Done')
  ));
}

function updateSettings(partial) {
  settings = { ...settings, ...partial };
  Storage.saveSettings(settings);
  syncAll();
}

/* ---------------- replay ---------------- */
function initReplayBar() {
  const bar = $('#replayBar');
  bar.innerHTML = '';
  const mk = (html, title, onclick, cls) => {
    const b = el('button', { class: 'rpbtn ' + (cls || ''), title, html, onclick });
    bar.appendChild(b);
    return b;
  };
  mk(icon('skipback', 15), 'Step back', () => {
    if (!state.replay) return;
    state.replay.index = Math.max(0, state.replay.index - 1);
    state.replay.playing = false;
    syncAll();
  });
  window.__rpPlay = mk(icon('play', 15), 'Play / pause', () => {
    if (!state.replay) return;
    state.replay.playing = !state.replay.playing;
    syncAll();
  }, 'play');
  mk(icon('skipfwd', 15), 'Step forward', () => {
    if (!state.replay) return;
    state.replay.index = Math.min(state.replay.candles.length - 1, state.replay.index + 1);
    state.replay.playing = false;
    syncAll();
  });
  mk(icon('restart', 14), 'Restart from start', () => {
    if (!state.replay) return;
    state.replay.index = state.replay.startIndex;
    state.replay.playing = true;
    syncAll();
  });
  const cnt = el('span', { class: 'rpcnt', id: 'rpCount' });
  bar.appendChild(cnt);
  const ohlc = el('span', { class: 'rpohlc', id: 'rpOhlc' });
  bar.appendChild(ohlc);
  const speed = el('select', {
    title: 'Replay speed',
    onchange: (e) => {
      if (state.replay) { state.replay.speed = +e.target.value; scheduleReplay(); }
    },
  });
  for (const s of [0.5, 1, 2, 4, 8, 16]) {
    speed.appendChild(el('option', { value: String(s) }, s + '×'));
  }
  speed.value = '1';
  bar.appendChild(speed);
  bar.appendChild(el('button', { class: 'rpclose', title: 'Exit replay', html: icon('x', 14), onclick: () => exitReplay() }));
}

function exitReplay() {
  state.replay = null;
  syncAll();
}

function renderReplayBar() {
  const bar = $('#replayBar');
  bar.hidden = !state.replay;
  if (!state.replay) return;
  const r = state.replay;
  $('#rpCount').textContent = `${r.index + 1} / ${r.candles.length}`;
  const c = r.candles[r.index];
  const tf = getTimeframe(settings.timeframe);
  if (c) {
    const bull = c.close >= c.open;
    const cls = bull ? 'up' : 'dn';
    $('#rpOhlc').innerHTML =
      `O <span class="${cls}">${formatPrice(c.open, null)}</span> ` +
      `H <span class="${cls}">${formatPrice(c.high, null)}</span> ` +
      `L <span class="${cls}">${formatPrice(c.low, null)}</span> ` +
      `C <span class="${cls}">${formatPrice(c.close, null)}</span> ` +
      `<span style="color: var(--faint)">· ${formatTimestamp(c.timestamp, tf)}</span>`;
  }
  window.__rpPlay.innerHTML = icon(r.playing ? 'pause' : 'play', 15);
  const sel = bar.querySelector('select');
  if (String(r.speed) !== sel.value) sel.value = String(r.speed);
}

let replayTimer = null;
function scheduleReplay() {
  clearTimeout(replayTimer);
  if (state.replay && state.replay.playing) {
    replayTimer = setTimeout(() => {
      const r = state.replay;
      if (!r || !r.playing) return;
      const next = r.index + 1;
      if (next >= r.candles.length) {
        r.playing = false;
      } else {
        r.index = next;
        r.playing = next < r.candles.length - 1;
      }
      syncAll();
    }, Math.round(800 / (state.replay.speed || 1)));
  }
}

function openReplaySetup() {
  const cd = computeChartData();
  const src = cd.candles;
  if (src.length < 2) return;
  const first = src[0].timestamp;
  const last = src[src.length - 1].timestamp;
  const def = src[Math.floor(src.length * 0.7)].timestamp;

  const modal = openModal('');
  const box = modal.querySelector('.modal');
  box.appendChild(mdhead('Replay setup', 'Watch candles unfold one by one on a frozen snapshot'));
  const body = el('div', { class: 'mdbody' });

  const dt = el('input', { type: 'datetime-local', value: toLocalInput(def), min: toLocalInput(first), max: toLocalInput(last) });
  body.appendChild(el('div', { class: 'field' },
    el('label', {}, 'Start time'),
    dt,
    el('div', { class: 'hint' }, `Local time. Data range: ${formatTimestamp(first, getTimeframe(settings.timeframe))} → ${formatTimestamp(last, getTimeframe(settings.timeframe))} (UTC).`)
  ));

  const speed = el('select', {}, ...[1, 2, 4, 8, 16].map((s) => el('option', { value: String(s) }, s + '×')));
  body.appendChild(el('div', { class: 'field' }, el('label', {}, 'Speed'), speed));

  body.appendChild(el('div', { class: 'hint' }, 'While replaying, the live feed keeps running in the background but the chart shows only candles up to the replay point — no future data can leak in.'));
  box.appendChild(body);

  box.appendChild(el('div', { class: 'mdfoot' },
    el('button', {
      class: 'btn primary', html: `${icon('play', 14)} Start replay`,
      onclick: () => {
        const ts = dt.value ? new Date(dt.value).getTime() : null;
        startReplayFrom(ts, +speed.value);
      },
    }),
    el('span', { class: 'spacer' }),
    el('button', { class: 'btn', onclick: closeModal }, 'Cancel')
  ));
}

function startReplayFrom(ts, speed) {
  const src = computeChartData().candles;
  if (src.length < 2 || ts == null) return;
  let idx = src.findIndex((c) => c.timestamp >= ts);
  if (idx < 0) idx = src.length - 1;
  if (idx > src.length - 2) idx = src.length - 2;
  if (idx < 0) idx = 0;
  state.replay = { candles: src.slice(), startIndex: idx, index: idx, playing: true, speed: speed || 1 };
  state.activeTool = 'cursor';
  state.selectedId = null;
  closeModal();
  syncAll();
}

/* ---------------- modals ---------------- */
function openModal(html) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="overlay"><div class="modal">${html || ''}</div></div>`;
  const overlay = root.querySelector('.overlay');
  overlay.addEventListener('mousedown', (e) => {
    if (e.target === overlay) closeModal();
  });
  return root;
}
function closeModal() {
  $('#modalRoot').innerHTML = '';
  pickerRefresh = null;
}

/* ---------------- canvas callbacks ---------------- */
const canvasCallbacks = {
  onAddDrawing: (d) => {
    pushHistory();
    state.drawings = [...state.drawings, d];
    state.activeTool = 'cursor';
    persistDrawings();
    renderLeftbar();
    syncAll();
    if (d.type === 'text') openTextEditor(d, true);
  },
  onRemoveLastDrawing: () => {
    if (!state.drawings.length) return;
    pushHistory();
    state.drawings = state.drawings.slice(0, -1);
    persistDrawings();
    renderLeftbar();
    syncAll();
  },
  onDeleteDrawing: (id) => {
    deleteDrawing(id);
  },
  onUpdateDrawing: (id, pointIndex, point) => {
    state.drawings = state.drawings.map((d) =>
      d.id === id ? { ...d, points: d.points.map((p, i) => (i === pointIndex ? point : p)) } : d
    );
    persistDrawings();
    syncAll();
  },
  onMoveDrawing: (id, dTs, dPrice) => {
    state.drawings = state.drawings.map((d) =>
      d.id === id
        ? { ...d, points: d.points.map((p) => ({ timestamp: p.timestamp + dTs, price: p.price + dPrice })) }
        : d
    );
    persistDrawings();
    syncAll();
  },
  // Resize one side of a rectangle by dragging its edge midpoint.
  onUpdateDrawingEdge: (id, edge, snapped) => {
    state.drawings = state.drawings.map((d) => {
      if (d.id !== id || d.type !== 'rectangle') return d;
      const [p0, p1] = d.points;
      let ts0 = p0.timestamp, pr0 = p0.price, ts1 = p1.timestamp, pr1 = p1.price;
      if (edge === 'top') { if (pr0 >= pr1) pr0 = snapped.price; else pr1 = snapped.price; }
      else if (edge === 'bottom') { if (pr0 <= pr1) pr0 = snapped.price; else pr1 = snapped.price; }
      else if (edge === 'left') { if (ts0 <= ts1) ts0 = snapped.timestamp; else ts1 = snapped.timestamp; }
      else if (edge === 'right') { if (ts0 >= ts1) ts0 = snapped.timestamp; else ts1 = snapped.timestamp; }
      return { ...d, points: [{ timestamp: ts0, price: pr0 }, { timestamp: ts1, price: pr1 }] };
    });
    persistDrawings();
    syncAll();
  },
  onSelectDrawing: (id) => {
    state.selectedId = id;
    if (id != null) {
      state.activeTool = 'cursor';
      state.mgrOpen = false;
    }
    renderLeftbar();
    renderDrawMgr();
    syncAll();
  },
  onBeginEdit: () => {
    pushHistory();
  },
  onAfterDraw: () => renderStylePopup(),
  onUndo: () => undoDrawing(),
  onRedo: () => redoDrawing(),
};

/* ---------------- Deriv wiring ---------------- */
let symbolsFetchInFlight = false;
async function maybeFetchSymbols() {
  if (state.derivSymbols.length || symbolsFetchInFlight) return;
  if (state.status !== Status.CONNECTED) return;
  symbolsFetchInFlight = true;
  try {
    const syms = await fetchActiveSymbols();
    if (!syms.length) throw new Error('Deriv returned no active symbols');
    state.derivSymbols = syms;
    extendSymbolsFromAux();
    const def =
      syms.find((s) => /volatility 75 index/i.test(s.name) && !/\b1s\b/i.test(s.name)) ||
      syms.find((s) => s.code === 'R_75') || syms[0];
    if (!state.selectedSymbol) {
      state.selectedSymbol = def;
      settings.lastSymbol = { ...def };
      Storage.saveSettings(settings);
      derivFeed.load(def, settings.timeframe, feedCallbacks);
    }
    state.error = null;
    renderBanner();
    renderMarketPanel();
    renderTopbar();
  } catch (e) {
    state.error = 'DERIV SYMBOL REQUEST FAILED: ' + e.message;
    renderBanner();
  } finally {
    symbolsFetchInFlight = false;
    setReady();
    syncAll();
  }
}

function setReady() {
  if (state.ready) return;
  state.ready = true;
  const boot = $('#boot');
  if (boot) boot.remove();
  syncAll();
}

/* ---------------- boot ---------------- */
function boot() {
  document.documentElement.dataset.theme = settings.theme;

  initTopbar();
  initLeftbar();
  initInfoPill();
  initMarketPanel();
  initReplayBar();

  canvas = new ChartCanvas($('#stage'), $('#chart'), canvasCallbacks);

  $('#symbolBtn').addEventListener('click', openSymbolPicker);
  $('#btnImport').addEventListener('click', openImportModal);
  $('#btnLatest').addEventListener('click', () => canvas.goToLatest());
  $('#btnExport').addEventListener('click', exportCsv);
  $('#btnReplay').addEventListener('click', () => {
    if (state.replay) exitReplay();
    else openReplaySetup();
  });
  $('#btnTheme').addEventListener('click', () => updateSettings({ theme: settings.theme === 'dark' ? 'light' : 'dark', colors: {} }));
  $('#btnSettings').addEventListener('click', openSettingsModal);
  $('#btnRetry').addEventListener('click', () => {
    state.error = null;
    if (state.mode !== 'DERIV') state.mode = 'DERIV';
    if (state.mode === 'DERIV' && state.selectedSymbol) derivFeed.load(state.selectedSymbol, settings.timeframe, feedCallbacks);
    derivSocket.forceReconnect();
    syncAll();
  });
  $('#btnUseDemo').addEventListener('click', handleDemo);
  // Clicking the connection badge forces an immediate reconnect + symbol reload.
  $('#connBadge').addEventListener('click', () => {
    if (state.mode !== 'DERIV') { openSymbolPicker(); return; }
    state.error = null;
    state.derivSymbols = [];
    symbolsFetchInFlight = false;
    if (state.selectedSymbol) derivFeed.load(state.selectedSymbol, settings.timeframe, feedCallbacks);
    derivSocket.forceReconnect();
    syncAll();
  });
  $('#zoomctl').addEventListener('click', (e) => {
    const z = e.target.closest('button') && e.target.closest('button').getAttribute('data-z');
    if (!z) return;
    if (z === 'in') canvas.zoomByCenter(1.3);
    else if (z === 'out') canvas.zoomByCenter(1 / 1.3);
    else if (z === 'older') canvas.panHistory();
    else if (z === 'latest') canvas.goToLatestView();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalRoot').children.length) closeModal();
  });

  derivSocket.onStatus = (s) => {
    state.status = s;
    renderConn();
    renderBanner();
    if (s === Status.CONNECTED) maybeFetchSymbols();
    else if (s === Status.ERROR && !state.ready) setReady(); // don't trap the user on the boot screen
  };
  derivSocket.onReconnect = () => {
    state.error = null;
    derivFeed.reconcile();
    if (!state.derivSymbols.length) maybeFetchSymbols();
  };

  // Restore a saved CSV dataset on first load (for IMPORTED mode continuity).
  const lastId = settings.lastDatasetId;
  if (lastId) {
    const ds = Storage.loadDataset();
    if (ds && ds.id === lastId && ds.rawCandles && ds.rawCandles.length) {
      state.dataset = ds; // keep available but don't override Deriv default mode
    }
  }

  // Migrate legacy annotations and restore the last instrument from its
  // IndexedDB candle cache before depending on live symbol discovery.
  Storage.migrateLegacyDrawings();
  if (state.selectedSymbol) derivFeed.load(state.selectedSymbol, settings.timeframe, feedCallbacks);
  requestPersistentStorage(true);
  derivSocket.connect();
  // Flush the local history store to IndexedDB when the page is closed.
  window.addEventListener('beforeunload', () => { if (derivFeed.store) derivFeed.store.flushNow(); });
  setInterval(renderConn, 1000);
  // Never trap the user on the boot screen if Deriv is unreachable.
  setTimeout(setReady, 5000);
  doSync();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch((error) => console.warn('PureChart offline shell registration failed:', error));
  });
}
</script>
