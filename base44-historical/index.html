    if (!c.length) return;
    const a = this.area();
    let bw = a.w / 120;
    bw = Math.max(MIN_BAR_WIDTH, Math.min(MAX_BAR_WIDTH, bw));
    this.view.barWidth = bw;
    this.view.rightIndex = c.length - 1;
    this.view.priceShift = 0;
    this.view.priceZoom = 1;
    this.clampView();
    this.scheduleDraw();
  }

  // Pan further back into history (negative = older candles).
  panHistory(frac) {
    if (!this.p.candles.length) return;
    const a = this.area();
    const step = (a.w / this.view.barWidth) * (frac != null ? frac : 0.8);
    this.view.rightIndex -= step;
    this.clampView();
    this.scheduleDraw();
  }

  // Jump to the newest candle at the current zoom level.
  goToLatestView() {
    const c = this.p.candles;
    if (!c.length) return;
    this.view.rightIndex = c.length - 1;
    this.view.priceShift = 0;
    this.view.priceZoom = 1;
    this.clampView();
    this.scheduleDraw();
  }

  handleWheel(e) {
    e.preventDefault();
    const c = this.p.candles;
    if (!c.length) return;
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const a = this.area();
    if (mx > a.w) return; // ignore wheel over the price scale
    // Trackpad two-finger horizontal swipe pans the time axis.
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
      this.view.rightIndex += e.deltaX / this.view.barWidth;
      this.clampView();
      this.scheduleDraw();
      return;
    }
    const idx = this.indexAtX(mx);
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    let bw = this.view.barWidth * factor;
    bw = Math.max(MIN_BAR_WIDTH, Math.min(MAX_BAR_WIDTH, bw));
    this.view.barWidth = bw;
    this.view.rightIndex = idx - 0.5 + (a.w - mx) / bw;
    this.clampView();
    this.scheduleDraw();
  }

  onPointerDown(e) {
    if (this.canvas.setPointerCapture) {
      try { this.canvas.setPointerCapture(e.pointerId); } catch { /* ignore */ }
    }
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 2) {
      const vals = [...this.pointers.values()];
      const midX = (vals[0].x + vals[1].x) / 2;
      const rect0 = this.canvas.getBoundingClientRect();
      this.pinch = {
        dist: Math.hypot(vals[0].x - vals[1].x, vals[0].y - vals[1].y),
        barWidth: this.view.barWidth,
        anchorIndex: this.indexAtX(midX - rect0.left),
      };
      this.drag = null;
      this.dragPoint = null;
      this.dragMove = null;
      this.dragEdge = null;
    } else if (this.pointers.size === 1) {
      // Dragging on the price scale stretches / shrinks the price axis.
      const rectA = this.canvas.getBoundingClientRect();
      const ax = e.clientX - rectA.left;
      const ay = e.clientY - rectA.top;
      const ar = this.area();
      if (ax > ar.w && ay <= ar.timeY) {
        const pr = this.visiblePriceRange();
        this.priceDrag = {
          startZoom: this.view.priceZoom || 1,
          startY: e.clientY,
          anchor: this.priceAtY(ay, pr.hi, pr.lo),
        };
        this.drag = null;
        this.dragPoint = null;
        this.dragMove = null;
        this.dragEdge = null;
        return;
      }
      // Double-tap in cursor mode resets the zoom to fit recent candles.
      const now = Date.now();
      const last = this.lastTap;
      this.lastTap = { x: e.clientX, y: e.clientY, time: now };
      if (
        this.p.activeTool === 'cursor' &&
        last && now - last.time < 300 &&
        Math.hypot(e.clientX - last.x, e.clientY - last.y) < 24
      ) {
        this.lastTap = null;
        this.resetZoom();
        return;
      }
      if (this.p.activeTool && this.p.activeTool !== 'cursor') {
        this.handleDrawDown(e);
      } else {
        const rect = this.canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const hit = this.hitTestPoint(mx, my);
        if (hit) {
          this.cb.onSelectDrawing && this.cb.onSelectDrawing(hit.drawingId);
          this.cb.onBeginEdit && this.cb.onBeginEdit();
          this.dragPoint = hit;
        } else {
          const edge = this.hitTestEdge(mx, my);
          if (edge) {
            this.cb.onSelectDrawing && this.cb.onSelectDrawing(edge.drawingId);
            this.cb.onBeginEdit && this.cb.onBeginEdit();
            this.dragEdge = edge;
          } else {
            const bodyId = this.hitTestBody(mx, my);
            if (bodyId) {
              this.cb.onSelectDrawing && this.cb.onSelectDrawing(bodyId);
              this.cb.onBeginEdit && this.cb.onBeginEdit();
              const { hi, lo } = this.visiblePriceRange();
              this.dragMove = {
                drawingId: bodyId,
                lastTs: this.timestampAtX(mx),
                lastPrice: this.priceAtY(my, hi, lo),
              };
            } else {
              this.cb.onSelectDrawing && this.cb.onSelectDrawing(null);
              this.drag = { x: e.clientX, y: e.clientY };
            }
          }
        }
      }
    }
  }

  onPointerMove(e) {
    if (this.pointers.has(e.pointerId)) {
      this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    }
    const rect = this.canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const a = this.area();
    const c = this.p.candles;

    if (this.pinch && this.pointers.size >= 2) {
      const vals = [...this.pointers.values()];
      const dist = Math.hypot(vals[0].x - vals[1].x, vals[0].y - vals[1].y);
      const midX = (vals[0].x + vals[1].x) / 2;
      const scale = dist / (this.pinch.dist || 1);
      let bw = this.pinch.barWidth * scale;
      bw = Math.max(MIN_BAR_WIDTH, Math.min(MAX_BAR_WIDTH, bw));
      const cmx = midX - rect.left;
      this.view.barWidth = bw;
      // Keep the anchor candle under the moving pinch center: spreading the
      // fingers zooms around that point, sliding the midpoint pans the view.
      this.view.rightIndex = this.pinch.anchorIndex - 0.5 + (a.w - cmx) / bw;
      this.clampView();
    } else if (this.priceDrag) {
      // Upward drag narrows the visible range and stretches candles; downward
      // drag widens the range and shrinks candles, anchored under the pointer.
      const zs = this.area();
      let z = this.priceDrag.startZoom * Math.exp((e.clientY - this.priceDrag.startY) / 220);
      z = Math.max(0.02, Math.min(60, z));
      this.view.priceZoom = z;
      this.view.priceShift = 0;
      const pr = this.visiblePriceRange();
      const t = Math.max(0, Math.min(1, (my - zs.y) / zs.h));
      this.view.priceShift = this.priceDrag.anchor - (pr.hi - t * (pr.hi - pr.lo));
    } else if (this.dragEdge) {
      const snapped = this.pointAt(mx, my);
      if (snapped) {
        this.cb.onUpdateDrawingEdge && this.cb.onUpdateDrawingEdge(this.dragEdge.drawingId, this.dragEdge.edge, snapped);
      }
    } else if (this.dragPoint) {
      const snapped = this.pointAt(mx, my);
      if (snapped) {
        this.cb.onUpdateDrawing && this.cb.onUpdateDrawing(this.dragPoint.drawingId, this.dragPoint.pointIndex, snapped);
      }
    } else if (this.dragMove) {
      const { hi, lo } = this.visiblePriceRange();
      const ts = this.timestampAtX(mx);
      const pr = this.priceAtY(my, hi, lo);
      const dTs = ts - this.dragMove.lastTs;
      const dPr = pr - this.dragMove.lastPrice;
      if (dTs !== 0 || dPr !== 0) {
        this.cb.onMoveDrawing && this.cb.onMoveDrawing(this.dragMove.drawingId, dTs, dPr);
        this.dragMove.lastTs = ts;
        this.dragMove.lastPrice = pr;
      }
    } else if (this.drawInProgress && this.drawInProgress.points.length >= 2) {
      const snapped = this.pointAt(mx, my);
      if (snapped) {
        this.drawInProgress.points[this.drawInProgress.points.length - 1] = snapped;
      }
      if (
        this.drawDrag && this.pointers.has(e.pointerId) &&
        Math.hypot(e.clientX - this.drawDrag.downX, e.clientY - this.drawDrag.downY) > 4
      ) {
        this.drawDrag.moved = true;
      }
    } else if (this.drag) {
      const dx = e.clientX - this.drag.x;
      const dy = e.clientY - this.drag.y;
      const { barWidth } = this.view;
      this.view.rightIndex -= dx / barWidth;
      // Vertical drag moves the price axis freely.
      if (dy) {
        const { hi, lo } = this.visiblePriceRange();
        this.view.priceShift = (this.view.priceShift || 0) + (dy / a.h) * (hi - lo);
      }
      this.clampView();
      this.drag.x = e.clientX;
      this.drag.y = e.clientY;
    }

    // Cursor affordance for drag/edit in cursor mode.
    const canvasEl = this.canvas;
    const tool = this.p.activeTool;
    const axisArea = this.area();
    let cur = 'crosshair';
    if (this.priceDrag) cur = 'ns-resize';
    else if (mx > axisArea.w && my <= axisArea.timeY) cur = 'ns-resize';
    else if (tool === 'cursor') {
      if (this.dragPoint || this.dragMove || this.dragEdge) cur = 'grabbing';
      else if (c.length && this.hitTestPoint(mx, my)) cur = 'grab';
      else if (c.length) {
        const he = this.hitTestEdge(mx, my);
        if (he) cur = he.edge === 'top' || he.edge === 'bottom' ? 'ns-resize' : 'ew-resize';
        else if (this.hitTestBody(mx, my)) cur = 'move';
        else cur = 'crosshair';
      } else cur = 'crosshair';
    }
    canvasEl.style.cursor = cur;

    if (c.length && mx >= 0 && mx <= a.w && my >= 0 && my <= a.timeY) {
      this.cross = { x: mx, y: my };
    } else {
      this.cross = null;
    }
    this.scheduleDraw();
  }

  onPointerUp(e) {
    const wasPinching = !!this.pinch;
    if (this.pointers.has(e.pointerId)) this.pointers.delete(e.pointerId);
    if (this.pointers.size < 2) this.pinch = null;
    if (this.pointers.size === 0) {
      this.drag = null;
      this.dragPoint = null;
      this.dragMove = null;
      this.dragEdge = null;
      this.priceDrag = null;
      // Finalize a drag-to-draw on release after movement; a tap (no movement)
      // leaves the drawing in progress for a second tap to place the end point.
      if (this.drawDrag && this.drawInProgress && this.drawDrag.moved) {
        this.cb.onAddDrawing && this.cb.onAddDrawing(this.drawInProgress);
        this.drawInProgress = null;
      }
      this.drawDrag = null;
    } else if (wasPinching && this.pointers.size === 1 && this.p.activeTool === 'cursor') {
      // One finger remains after a pinch — continue panning with it.
      const rem = [...this.pointers.values()][0];
      this.drag = { x: rem.x, y: rem.y };
      this.dragPoint = null;
      this.dragMove = null;
      this.dragEdge = null;
    }
    if (this.canvas.releasePointerCapture) {
      try { this.canvas.releasePointerCapture(e.pointerId); } catch { /* ignore */ }
    }
  }

  onPointerLeave() {
    this.cross = null;
    this.scheduleDraw();
  }

  onKeyDown(e) {
    if (e.key === 'Escape') {
      this.cross = null;
      this.drawInProgress = null;
      this.scheduleDraw();
    } else if (e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      // Delete the selected drawing if one is selected; otherwise the last one.
      if (this.p.selectedId) {
        this.cb.onDeleteDrawing && this.cb.onDeleteDrawing(this.p.selectedId);
      } else {
        this.cb.onRemoveLastDrawing && this.cb.onRemoveLastDrawing();
      }
    } else if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      this.cb.onUndo && this.cb.onUndo();
    } else if (((e.ctrlKey || e.metaKey) && (e.key === 'y' || e.key === 'Y')) ||
               ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'z' || e.key === 'Z'))) {
      e.preventDefault();
      this.cb.onRedo && this.cb.onRedo();
    } else if (e.key === '+' || e.key === '=') {
      this.zoomByCenter(1.2);
    } else if (e.key === '-' || e.key === '_') {
      this.zoomByCenter(1 / 1.2);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      if (!this.p.candles.length) return;
      const a = this.area();
      const step = (a.w / this.view.barWidth) * 0.2;
      this.view.rightIndex += e.key === 'ArrowLeft' ? -step : step;
      this.clampView();
      this.scheduleDraw();
    } else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) {
        this.wrap.requestFullscreen && this.wrap.requestFullscreen();
      } else {
        document.exitFullscreen && document.exitFullscreen();
      }
    }
  }

  draw() {
    const canvas = this.canvas;
    if (!canvas) return;
    const ctx = this.ctx;
    const { w, h, dpr } = this.size;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const c = this.p.candles;
    const th = this.p.theme;
    if (!c.length) {
      ctx.fillStyle = th.bg;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = th.text;
      ctx.font = '13px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.p.emptyMessage || 'No data — import a CSV to begin.', w / 2, h / 2);
      return;
    }

    // Two passes: a provisional range, then re-derive the plot area once the
    // price axis has resized to fit its labels.
    const first = this.visibleRange();
    const firstRange = this.priceRange(first.left, first.right);
    const firstDec =
      this.p.decimals != null
        ? this.p.decimals
        : guessDecimals((firstRange.hi + firstRange.lo) / 2);
    this.updateScaleMetrics(ctx, firstRange.hi, firstRange.lo, firstDec);

    const a = this.area();
    const { left, right } = this.visibleRange();
    const { hi, lo } = this.priceRange(left, right);
    const dec = this.p.decimals != null ? this.p.decimals : guessDecimals((hi + lo) / 2);
    const tf = getTimeframe(this.p.timeframeLabel);

    // Background.
    ctx.fillStyle = th.bg;
    ctx.fillRect(0, 0, w, h);
    // Scale panels.
    ctx.fillStyle = th.scaleBg;
    ctx.fillRect(a.w, 0, a.priceWidth, h);
    ctx.fillRect(0, a.timeY, w, a.timeHeight);

    this.drawGrid(ctx, a, hi, lo, th, dec);
    if (this.p.separators) this.drawPeriodSeparators(ctx, a, left, right, tf, th);
    this.drawTimeScale(ctx, a, left, right, tf, th);
    this.drawCandles(ctx, a, left, right, hi, lo, th, this.p.formingIndex);
    this.drawLastPrice(ctx, a, hi, lo, th, dec);
    this.drawDrawings(ctx, a, hi, lo, th, dec);
    this.drawCrosshair(ctx, a, hi, lo, dec, tf, th);
    this.drawInfoBox(ctx, a, th, dec, tf);

    // Axis separators.
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.w + 0.5, 0);
    ctx.lineTo(a.w + 0.5, a.timeY);
    ctx.moveTo(0, a.timeY + 0.5);
    ctx.lineTo(w, a.timeY + 0.5);
    ctx.stroke();

    // Notify the UI every frame so overlays (drawing style popup) track the view.
    if (this.cb.onAfterDraw) this.cb.onAfterDraw();
  }

  // MT5-style "period separators": vertical dashed lines where a period starts,
  // drawn at the first candle of each new period. The separator period widens
  // with the chart timeframe — intraday charts separate on UTC days, daily and
  // 2–6 day charts on weeks (Mondays), up to weekly on calendar months, and
  // monthly charts on calendar years.
  drawPeriodSeparators(ctx, a, left, right, tf, th) {
    const DAY = 24 * 60 * 60 * 1000;
    const c = this.p.candles;
    if (!c.length) return;
    let periodTf;
    if (tf.ms < DAY) periodTf = { label: '1D', ms: DAY };
    else if (tf.ms < 7 * DAY) periodTf = { label: '1W', ms: 7 * DAY };
    else if (tf.label === '1W' || tf.ms < 30 * DAY) periodTf = { label: '1M', ms: 30 * DAY };
    else periodTf = { label: '1Y', ms: 365 * DAY };
    const i0 = Math.max(0, Math.floor(left) - 1);
    const i1 = Math.min(c.length - 1, Math.ceil(right));
    if (i1 <= i0) return;
    ctx.save();
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    let prev = getAnchor(c[i0].timestamp, periodTf);
    for (let i = i0 + 1; i <= i1; i++) {
      const anc = getAnchor(c[i].timestamp, periodTf);
      if (anc !== prev) {
        const x = Math.round(this.xOfTimestamp(c[i].timestamp)) + 0.5;
        if (x >= 0 && x <= a.w) {
          ctx.moveTo(x, a.y);
          ctx.lineTo(x, a.timeY);
        }
        prev = anc;
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  // Screen-space anchor of a drawing — positions the floating style popup.
  drawingAnchorScreen(id) {
    const d = (this.p.drawings || []).find((x) => x.id === id);
    if (!d) return null;
    const pts = d.points || [];
    if (!pts.length) return null;
    const { hi, lo } = this.visiblePriceRange();
    const a = this.area();
    if (d.type === 'horizontal') {
      return { x: Math.min(a.w - 150, Math.max(150, a.w / 2)), y: this.yOfPrice(pts[0].price, hi, lo) };
    }
    if (d.type === 'text') {
      return { x: this.xOfTimestamp(pts[0].timestamp), y: this.yOfPrice(pts[0].price, hi, lo) - (d.fontSize || 14) - 10 };
    }
    if (pts.length >= 2) {
      const x1 = this.xOfTimestamp(pts[0].timestamp);
      const y1 = this.yOfPrice(pts[0].price, hi, lo);
      const x2 = this.xOfTimestamp(pts[1].timestamp);
      const y2 = this.yOfPrice(pts[1].price, hi, lo);
      return { x: (x1 + x2) / 2, y: Math.min(y1, y2) - 16 };
    }
    return { x: this.xOfTimestamp(pts[0].timestamp), y: this.yOfPrice(pts[0].price, hi, lo) - 16 };
  }

  drawGrid(ctx, a, hi, lo, th, dec) {
    const step = niceStep(hi - lo, 7);
    const start = Math.ceil(lo / step) * step;
    ctx.lineWidth = 1;
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (let p = start; p <= hi; p += step) {
      const y = this.yOfPrice(p, hi, lo);
      if (y < a.y || y > a.timeY) continue;
      if (this.p.gridVisible) {
        ctx.strokeStyle = th.grid;
        ctx.beginPath();
        ctx.moveTo(0, y + 0.5);
        ctx.lineTo(a.w, y + 0.5);
        ctx.stroke();
      }
      ctx.fillStyle = th.text;
      ctx.textAlign = 'left';
      ctx.fillText(formatPrice(p, dec), a.w + 8, y);
    }
  }

  drawTimeScale(ctx, a, left, right, tf, th) {
    const { barWidth } = this.view;
    const c = this.p.candles;
    ctx.fillStyle = th.text;
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    const minLabelPx = 72;
    const stepCandles = Math.max(1, Math.ceil(minLabelPx / barWidth));
    for (let i = left; i <= right && i < c.length; i++) {
      if (i % stepCandles !== 0 && i !== left) continue;
      const x = this.xOfIndex(i);
      if (x < -40 || x > a.w + 40) continue;
      ctx.strokeStyle = th.grid;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, a.timeY);
      ctx.lineTo(x + 0.5, a.timeY + 5);
      ctx.stroke();
      ctx.fillStyle = th.text;
      ctx.textAlign = 'left';
      const prevTs = i > 0 ? c[i - 1].timestamp : null;
      ctx.fillText(formatTimeScale(c[i].timestamp, tf, prevTs), x + 4, a.timeY + a.timeHeight / 2);
    }
  }

  drawCandles(ctx, a, left, right, hi, lo, th, formingIndex) {
    const { barWidth } = this.view;
    const c = this.p.candles;
    const bodyWidth = Math.max(1, barWidth * 0.72);
    ctx.lineWidth = 1;
    for (let i = left; i <= right && i < c.length; i++) {
      const k = c[i];
      const x = this.xOfIndex(i);
      if (x < -barWidth || x > a.w + barWidth) continue;
      const bull = k.close >= k.open;
      const color = bull ? th.bull : th.bear;
      const forming = i === formingIndex;
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      const yH = this.yOfPrice(k.high, hi, lo);
      const yL = this.yOfPrice(k.low, hi, lo);
      const yO = this.yOfPrice(k.open, hi, lo);
      const yC = this.yOfPrice(k.close, hi, lo);
      // Wick
      ctx.beginPath();
      ctx.moveTo(Math.round(x) + 0.5, yH);
      ctx.lineTo(Math.round(x) + 0.5, yL);
      ctx.stroke();
      // Body — forming candles are drawn hollow (dashed outline) to distinguish
      // them from completed candles. Completed candles are solid.
      const top = Math.min(yO, yC);
      const bh = Math.max(1, Math.abs(yC - yO));
      const bx = Math.round(x - bodyWidth / 2);
      const bw = Math.round(bodyWidth);
      if (forming) {
        ctx.save();
        ctx.globalAlpha = 0.45;
        ctx.fillRect(bx, top, bw, bh);
        ctx.globalAlpha = 1;
        ctx.setLineDash([2, 2]);
        ctx.strokeRect(bx + 0.5, top + 0.5, bw - 1, Math.max(1, bh - 1));
        ctx.setLineDash([]);
        ctx.restore();
      } else {
        ctx.fillRect(bx, top, bw, bh);
      }
    }
  }

  drawLastPrice(ctx, a, hi, lo, th, dec) {
    const c = this.p.candles;
    const last = c[c.length - 1];
    if (!last) return;
    const y = this.yOfPrice(last.close, hi, lo);
    if (y < 0 || y > a.timeY) return;
    const bull = last.close >= last.open;
    const color = bull ? th.bull : th.bear;
    ctx.strokeStyle = color;
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + 0.5);
    ctx.lineTo(a.w, y + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = color;
    ctx.fillRect(a.w, y - 9, a.priceWidth, 18);
    ctx.fillStyle = '#fff';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(formatPrice(last.close, dec), a.w + 8, y);
  }

  drawDrawings(ctx, a, hi, lo, th, dec) {
    void th;
    const all = [...(this.p.drawings || [])];
    if (this.drawInProgress) all.push(this.drawInProgress);
    for (const d of all) {
      if (d.hidden && d !== this.drawInProgress) continue;
      const preview = d === this.drawInProgress;
      const selected = d.id === this.p.selectedId;
      ctx.save();
      if (preview) ctx.globalAlpha = 0.75;
      this.drawOne(ctx, a, hi, lo, dec, d, selected);
      ctx.restore();
      if (!preview) this.drawHandles(ctx, a, hi, lo, d, selected);
    }
  }

  drawHandles(ctx, a, hi, lo, d, selected) {
    const pts = d.points || [];
    ctx.save();
    ctx.fillStyle = selected ? '#26a69a' : '#4a9eff';
    ctx.strokeStyle = '#0b0e11';
    ctx.lineWidth = 1;
    for (const p of pts) {
      const x = d.type === 'horizontal' ? a.w - 10 : this.xOfTimestamp(p.timestamp);
      const y = this.yOfPrice(p.price, hi, lo);
      ctx.beginPath();
      ctx.arc(x, y, selected ? 6 : 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
    // Edge midpoint handles for rectangles — drag a side to resize it.
    if (d.type === 'rectangle' && pts.length >= 2 && !d.hidden) {
      const x1 = this.xOfTimestamp(pts[0].timestamp);
      const y1 = this.yOfPrice(pts[0].price, hi, lo);
      const x2 = this.xOfTimestamp(pts[1].timestamp);
      const y2 = this.yOfPrice(pts[1].price, hi, lo);
      const cx = (Math.min(x1, x2) + Math.max(x1, x2)) / 2;
      const cy = (Math.min(y1, y2) + Math.max(y1, y2)) / 2;
      const mids = [
        [cx, Math.min(y1, y2)],
        [cx, Math.max(y1, y2)],
        [Math.min(x1, x2), cy],
        [Math.max(x1, x2), cy],
      ];
      ctx.fillStyle = selected ? '#26a69a' : '#3b6fb0';
      for (const [mxp, myp] of mids) {
        ctx.beginPath();
        ctx.rect(mxp - 4, myp - 4, 8, 8);
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawOne(ctx, a, hi, lo, dec, d, selected) {
    const color = d.color || DEFAULT_DRAW_COLOR;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = (d.width || 2) + (selected ? 0.7 : 0);
    ctx.setLineDash(dashPatternFor(d));
    const pts = d.points || [];

    if (d.type === 'text' && pts[0]) {
      const x = this.xOfTimestamp(pts[0].timestamp);
      const y = this.yOfPrice(pts[0].price, hi, lo);
      const size = d.fontSize || 14;
      ctx.font = `${size}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const lines = String(d.text || 'Text').split('\n');
      const lh = size * 1.3;
      const y0 = y - ((lines.length - 1) * lh) / 2;
      for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], x, y0 + i * lh);
      return;
    }

    if (d.type === 'vertical' && pts[0]) {
      const x = this.xOfTimestamp(pts[0].timestamp);
      if (x < a.x || x > a.w) return;
      ctx.beginPath();
      ctx.moveTo(x + 0.5, a.y);
      ctx.lineTo(x + 0.5, a.timeY);
      ctx.stroke();
      return;
    }
    if (d.type === 'horizontal') {
      const y = this.yOfPrice(pts[0].price, hi, lo);
      if (y < a.y || y > a.timeY) return;
      ctx.beginPath();
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(a.w, y + 0.5);
      ctx.stroke();
      ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'bottom';
      ctx.fillText(formatPrice(pts[0].price, dec), 6, y - 2);
      return;
    }

    if ((d.type === 'long_position' || d.type === 'short_position') && pts.length >= 3) {
      const x1 = this.xOfTimestamp(pts[0].timestamp);
      const x2 = this.xOfTimestamp(pts[2].timestamp);
      const yEntry = this.yOfPrice(pts[0].price, hi, lo);
      const yStop = this.yOfPrice(pts[1].price, hi, lo);
      const yTarget = this.yOfPrice(pts[2].price, hi, lo);
      const left = Math.min(x1, x2), right = Math.max(x1, x2);
      const riskTop = Math.min(yEntry, yStop), riskBottom = Math.max(yEntry, yStop);
      const rewardTop = Math.min(yEntry, yTarget), rewardBottom = Math.max(yEntry, yTarget);
      ctx.save();
      ctx.globalAlpha = 0.20; ctx.fillStyle = '#ef5350'; ctx.fillRect(left, riskTop, right - left, riskBottom - riskTop);
      ctx.globalAlpha = 0.20; ctx.fillStyle = '#26a69a'; ctx.fillRect(left, rewardTop, right - left, rewardBottom - rewardTop);
      ctx.globalAlpha = 1; ctx.strokeStyle = color; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(left, yEntry); ctx.lineTo(right, yEntry); ctx.stroke();
      ctx.setLineDash(dashPatternFor(d));
      ctx.restore();
      const risk = Math.abs(pts[0].price - pts[1].price);
      const reward = Math.abs(pts[2].price - pts[0].price);
      const rr = risk > 0 ? reward / risk : 0;
      ctx.fillStyle = color; ctx.font = '10px ui-sans-serif, system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(`${d.type === 'long_position' ? 'Long' : 'Short'} · R:R ${rr.toFixed(2)}`, left + 4, Math.max(12, Math.min(a.timeY - 4, Math.min(rewardTop, riskTop) - 3)));
      return;
    }
    if (pts.length < 2) return;
    const x1 = this.xOfTimestamp(pts[0].timestamp);
    const y1 = this.yOfPrice(pts[0].price, hi, lo);
    const x2 = this.xOfTimestamp(pts[1].timestamp);
    const y2 = this.yOfPrice(pts[1].price, hi, lo);

    if (d.type === 'trendline') {
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    } else if (d.type === 'rectangle') {
      const x = Math.min(x1, x2);
      const y = Math.min(y1, y2);
      const w = Math.abs(x2 - x1);
      const h = Math.abs(y2 - y1);
      const prevAlpha = ctx.globalAlpha;
      ctx.globalAlpha = prevAlpha * 0.15;
      ctx.fillRect(x, y, w, h);
      ctx.globalAlpha = prevAlpha;
      ctx.strokeRect(x + 0.5, y + 0.5, w, h);
    } else if (d.type === 'fibonacci') {
      const hiP = Math.max(pts[0].price, pts[1].price);
      const loP = Math.min(pts[0].price, pts[1].price);
      const span = hiP - loP || 1;
      const left = Math.min(x1, x2);
      const right = Math.max(x1, x2);
      ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      for (const lvl of FIB_LEVELS) {
        const p = hiP - lvl * span;
        const y = this.yOfPrice(p, hi, lo);
        if (y < a.y || y > a.timeY) continue;
        const prevAlpha = ctx.globalAlpha;
        ctx.globalAlpha = prevAlpha * 0.5;
        ctx.setLineDash([2, 3]);
        ctx.beginPath();
        ctx.moveTo(left, y + 0.5);
        ctx.lineTo(right, y + 0.5);
        ctx.stroke();
        ctx.setLineDash(dashPatternFor(d));
        ctx.globalAlpha = prevAlpha;
        ctx.fillText(lvl.toFixed(3), left + 4, y);
      }
      ctx.strokeStyle = color;
      const prevAlpha = ctx.globalAlpha;
      ctx.globalAlpha = prevAlpha * 0.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      ctx.globalAlpha = prevAlpha;
    }
  }

  drawCrosshair(ctx, a, hi, lo, dec, tf, th) {
    const ch = this.cross;
    if (!ch) return;
    const x = Math.max(0, Math.min(a.w, ch.x));
    const y = Math.max(0, Math.min(a.timeY, ch.y));
    ctx.strokeStyle = th.crosshair;
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(Math.round(x) + 0.5, 0);
    ctx.lineTo(Math.round(x) + 0.5, a.timeY);
    ctx.moveTo(0, Math.round(y) + 0.5);
    ctx.lineTo(a.w, Math.round(y) + 0.5);
    ctx.stroke();
    ctx.setLineDash([]);

    // Price label on the right scale.
    const price = this.priceAtY(y, hi, lo);
    ctx.fillStyle = th.crosshair;
    ctx.fillRect(a.w, y - 9, a.priceWidth, 18);
    ctx.fillStyle = '#fff';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(formatPrice(price, dec), a.w + 8, y);

    // Time label on the bottom scale.
    const c = this.p.candles;
    const idx = Math.round(this.indexAtX(x));
    const clamped = Math.max(0, Math.min(c.length - 1, idx));
    const k = c[clamped];
    if (k) {
      const label = formatTimeScale(k.timestamp, tf, clamped > 0 ? c[clamped - 1].timestamp : null);
      ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
      const tw = ctx.measureText(label).width + 14;
      ctx.fillStyle = th.crosshair;
      ctx.fillRect(Math.max(0, Math.min(a.w - tw, x - tw / 2)), a.timeY, tw, a.timeHeight);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, x, a.timeY + a.timeHeight / 2);
    }
  }

  drawInfoBox(ctx, a, th, dec, tf) {
    const c = this.p.candles;
    let k = null;
    const ch = this.cross;
    if (ch) {
      const idx = Math.round(this.indexAtX(ch.x));
      k = c[Math.max(0, Math.min(c.length - 1, idx))];
    } else {
      k = c[Math.max(0, Math.min(c.length - 1, Math.round(this.view.rightIndex)))];
    }
    if (!k) return;
    const bull = k.close >= k.open;
    ctx.font = '12px ui-sans-serif, system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';
    // Header: symbol · timeframe
    ctx.fillStyle = bull ? th.bull : th.bear;
    ctx.fillText(`${this.p.symbol} · ${this.p.timeframeLabel}`, 12, 10);
    ctx.fillStyle = th.text;
    let y = 30;
    ctx.fillText(`O  ${formatPrice(k.open, dec)}`, 12, y);
    y += 16;
    ctx.fillText(`H  ${formatPrice(k.high, dec)}`, 12, y);
    y += 16;
    ctx.fillText(`L  ${formatPrice(k.low, dec)}`, 12, y);
    y += 16;
    ctx.fillStyle = bull ? th.bull : th.bear;
    ctx.fillText(`C  ${formatPrice(k.close, dec)}`, 12, y);
    y += 18;
    ctx.fillStyle = th.text;
    ctx.fillText(formatTimestamp(k.timestamp, tf), 12, y);
  }
}

function icon(name, size) {
  const s = size || 15;
  return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24">${ICONS[name] || ''}</svg>`;
}

/* ---------------- helpers ---------------- */
const $ = (sel) => document.querySelector(sel);

function el(tag, attrs, ...children) {
  const n = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') n.addEventListener(k.slice(2).toLowerCase(), v);
      else if (v != null) n.setAttribute(k, v);
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') {
      // icon() markup and other inline SVG strings are inserted as HTML,
      // everything else as plain text.
      const s = String(c);
      if (s.trim().startsWith('<svg')) {
        const t = document.createElement('template');
        t.innerHTML = s;
        n.appendChild(t.content);
      } else {
        n.appendChild(document.createTextNode(s));
      }
    } else {
      n.appendChild(c);
    }
  }
  return n;
}

function toLocalInput(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
}

/* ---------------- app state ---------------- */
const DEFAULT_SETTINGS = {
  theme: 'dark', colors: {}, timeframe: '5m', decimals: null,
  gridVisible: true, lastDatasetId: null, toolbarOpen: true,
  customTfs: [], lastSymbol: null,
};
let settings = { ...DEFAULT_SETTINGS, ...Storage.loadSettings() };
// Restore user-added (typable) timeframes from the previous session.
for (const t of settings.customTfs || []) {
  if (t && t.label && t.ms) registerCustomTf(t.label, t.ms);
}

function rememberedSymbol() {
  const saved = settings.lastSymbol;
  if (typeof saved === 'string' && saved) return { code: saved, name: saved, source: 'OPTIONS' };
  if (!saved || typeof saved.code !== 'string' || !saved.code) return null;
  return { ...saved, name: saved.name || saved.code, source: saved.source || 'OPTIONS' };
}

const state = {
  mode: 'DERIV',            // 'DERIV' | 'IMPORTED' | 'DEMO'
  dataset: null,
  derivSymbols: [],
  auxSymbolsState: 'idle',   // idle | loading | loaded | unreachable | none-extra
  auxExtraCount: 0,
  selectedSymbol: rememberedSymbol(),
  derivData: { candles: [], formingIndex: -1, gaps: [], lastTick: null, sourceLabel: null, construction: null },
  status: Status.DISCONNECTED,
  lastTick: null,

  redoStack: [],
  replay: null,

  mgrOpen: false,
  marketOpen: false,
  marketSearch: '',
};

let canvas = null;
const themeObj = () => buildTheme(settings);

/* ---------------- drawings history (audit fix B) ---------------- */
// Every mutation pushes its previous state so moving, endpoint edits, deletes
// and clear-all are all reversible — not just creation.
function pushHistory() {
  state.undoStack.push(JSON.stringify(state.drawings));
  if (state.undoStack.length > 100) state.undoStack.shift();
  state.redoStack.length = 0;
}
function undoDrawing() {
  if (!state.undoStack.length) return;
  state.redoStack.push(JSON.stringify(state.drawings));
  state.drawings = JSON.parse(state.undoStack.pop());
  state.selectedId = null;
  persistDrawings();
  syncAll();
}
function redoDrawing() {
  if (!state.redoStack.length) return;
  state.undoStack.push(JSON.stringify(state.drawings));
  state.drawings = JSON.parse(state.redoStack.pop());
  state.selectedId = null;
  persistDrawings();
  syncAll();
}

let persistTimer = null;
function persistDrawings() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => Storage.saveDrawings(drawingsKey(), state.drawings), 250);
}

function drawingsKey() {
  if (state.mode === 'DERIV') return state.selectedSymbol ? state.selectedSymbol.code : null;
  if (state.mode === 'IMPORTED') return state.dataset ? state.dataset.id : null;
  if (state.mode === 'DEMO') return 'demo';
  return null;
}

// Drawing ownership follows chart identity (audit fix A): drawings are stored
// per instrument, not per randomly-generated panel id.
let lastDrawingsKey = undefined;
let drawingLoadGeneration = 0;
function syncDrawingsIdentity() {
  const k = drawingsKey();
  if (k !== lastDrawingsKey) {
    lastDrawingsKey = k;
    const generation = ++drawingLoadGeneration;
    state.drawings = Storage.loadDrawingsLegacy(k);
    state.selectedId = null;
    state.undoStack = [];
    state.redoStack = [];
    renderDrawMgr();
    renderLeftbar();
    const initial = JSON.stringify(state.drawings);
    Storage.loadDrawings(k).then((drawings) => {
      if (generation !== drawingLoadGeneration || lastDrawingsKey !== k) return;
      if (JSON.stringify(state.drawings) === initial) state.drawings = drawings;
      else Storage.saveDrawings(k, state.drawings);
      syncAll();
    }).catch(() => { /* localStorage mirror remains available */ });
  }
}

/* ---------------- feed callbacks ---------------- */
const feedCallbacks = {
  onData: (d) => { state.derivData = d; syncAll(); },
  onTick: (t) => { state.lastTick = t.timestamp; syncAll(); },
  onError: (msg) => { state.error = msg; renderBanner(); },
};

/* ---------------- chart data composition ---------------- */
function computeChartData() {
  if (state.mode === 'DERIV') {
    const d = state.derivData;
    const candles = d.candles || [];
    const first = candles.length ? candles[0].timestamp : null;
    const last = candles.length ? candles[candles.length - 1].timestamp : null;
    const live = state.lastTick != null;
    return {
      candles,
      formingIndex: d.formingIndex != null ? d.formingIndex : -1,
      symbol: (state.selectedSymbol && (state.selectedSymbol.name || state.selectedSymbol.code)) || '',
      code: (state.selectedSymbol && state.selectedSymbol.code) || '',
      source: live ? 'DERIV API — LIVE' : 'DERIV API — HISTORICAL',
      connection: state.status,
      sourceTimeframe: d.sourceLabel,
      construction: d.construction,
      candleCount: candles.length,
      first,
      last,
      currentStatus: d.formingIndex >= 0 ? 'FORMING' : candles.length ? 'COMPLETE' : '—',
      gaps: d.gaps || [],
      lastTick: state.lastTick,
      decimals: state.selectedSymbol && state.selectedSymbol.pip ? pipDecimals(state.selectedSymbol.pip) : null,
    };
  }
  const ds = state.dataset;
  const candles = ds && ds.rawCandles ? aggregate(ds.rawCandles, settings.timeframe) : [];
  const first = candles.length ? candles[0].timestamp : null;
  const last = candles.length ? candles[candles.length - 1].timestamp : null;
  return {
    candles,
    formingIndex: -1,
    symbol: (ds && ds.symbol) || '',
    code: '',
    source: state.mode === 'IMPORTED' ? 'CSV IMPORT' : 'DEMO',
    connection: '—',
    sourceTimeframe: (ds && ds.meta && ds.meta.sourceTimeframe) || (ds && ds.rawCandles ? (detectSourceTimeframe(ds.rawCandles) || {}).label : null),
    construction: state.mode === 'IMPORTED' ? 'CSV IMPORT' : 'DEMO',
    candleCount: candles.length,
    first,
    last,
    currentStatus: '—',
    gaps: [],
    lastTick: null,
    decimals: settings.decimals,
  };
}

// Replay works on a frozen snapshot so live ticks can never leak future data.
function displayCandles() {
  if (state.replay) return state.replay.candles.slice(0, state.replay.index + 1);
  return computeChartData().candles;
}

/* ---------------- central render ---------------- */
let syncQueued = false;
function syncAll() {
  if (syncQueued) return;
  syncQueued = true;
  requestAnimationFrame(() => {
    syncQueued = false;
    doSync();
  });
}

function doSync() {
  syncDrawingsIdentity();
  const cd = computeChartData();
  const dc = state.replay ? state.replay.candles.slice(0, state.replay.index + 1) : cd.candles;
  const emptyMessage =
    state.mode === 'DERIV'
      ? (cd.candles.length ? null : 'Waiting for Deriv market data…')
      : (cd.candles.length ? null : 'No dataset loaded.');

  canvas.update({
    candles: dc,
    theme: themeObj(),
    symbol: cd.symbol,
    timeframeLabel: settings.timeframe,
    decimals: cd.decimals,
    gridVisible: settings.gridVisible !== false,
    separators: settings.separators !== false,
    formingIndex: state.replay ? -1 : cd.formingIndex,
    emptyMessage,
    activeTool: state.activeTool,
    drawings: state.drawings,
    selectedId: state.selectedId,
  });

  renderTopbar(cd);
  renderBanner();
  renderInfoPanel(cd, dc);
  renderReplayBar();
  renderLeftbar();
  renderDrawMgr();
  renderStylePopup();
  scheduleReplay();
}

function renderTfBar() {
  const bar = $('#tfbar');
  bar.innerHTML = '';
  for (const tf of TOOLBAR_TIMEFRAMES) {
    bar.appendChild(el('button', {

    }, tf.label));
  }
  // Compact picker for multi-day timeframes — keeps the strip readable while
  // they stay first-class timeframes for aggregation.
  const wrap = el('span', { class: 'tfdd' });
  const mbtn = el('button', {
    class: 'tfbtn', 'data-tf': 'multiday', title: 'Multi-day timeframes (1.75D…14D)',
  }, '1D+');
  const menu = el('span', { class: 'tfddmenu' });
  for (const label of MULTI_DAY_TIMEFRAMES) {
    menu.appendChild(el('button', {
      class: 'tfbtn', 'data-tf': label, title: label + ' timeframe',
      onclick: () => { menu.classList.remove('open'); setTimeframe(label); },
    }, label));
  }
  mbtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  wrap.appendChild(mbtn);
  wrap.appendChild(menu);
  bar.appendChild(wrap);
  // User-added (typable) timeframes as chips after the presets.
  for (const tf of CUSTOM_TFS) {
    if (TIMEFRAMES.some((t) => t.label === tf.label)) continue;
    bar.appendChild(el('button', {
      class: 'tfbtn custom', 'data-tf': tf.label, title: tf.label + ' custom timeframe',
      onclick: () => setTimeframe(tf.label),
    }, tf.label));
  }
  // MT5-style typable timeframe: type "45m", "3h", "2d", "1w", "30s"… Enter.
  bar.appendChild(el('input', {
    id: 'tfCustom', type: 'text', spellcheck: false, autocomplete: 'off',
    placeholder: 'custom…', title: 'Type a timeframe and press Enter — e.g. 30s, 45m, 3h, 2d, 1w (or 1mo for a month)',
    onkeydown: (e) => {
      if (e.key !== 'Enter') return;
      const parsed = parseTfInput(e.target.value);
      if (!parsed) {
        e.target.classList.add('bad');
        setTimeout(() => { const b = $('#tfCustom'); if (b) b.classList.remove('bad'); }, 700);
        return;
      }
      applyCustomTf(parsed);
    },
  }));
}

function applyCustomTf(parsed) {
  registerCustomTf(parsed.label, parsed.ms);
  settings.customTfs = CUSTOM_TFS.map((t) => ({ label: t.label, ms: t.ms }));
  Storage.saveSettings(settings);
  renderTfBar();
  setTimeframe(parsed.label);
}

function setTimeframe(tfLabel) {
  // Canonicalize typable labels ("3h" → "3H") and auto-register unseen ones,
  // so the local history store always resolves the timeframe object.
  const parsed = parseTfInput(tfLabel);
  if (parsed) tfLabel = parsed.label;
  if (parsed && !allTimeframes().some((t) => t.label === tfLabel)) {
    registerCustomTf(tfLabel, parsed.ms);
    settings.customTfs = CUSTOM_TFS.map((x) => ({ label: x.label, ms: x.ms }));
    Storage.saveSettings(settings);
    renderTfBar();
  }
  settings.timeframe = tfLabel;
  Storage.saveSettings(settings);
  if (state.replay) state.replay = null; // leaving the timeframe ends any replay
  if (state.mode === 'DERIV' && state.selectedSymbol) derivFeed.retarget(tfLabel);
  syncAll();
}

function renderTopbar(cd) {

function relativeAge(ts) {
  if (!Number.isFinite(ts)) return 'time unknown';
  const seconds = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (seconds < 10) return 'just now';
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

function utcLabel(ts) {
  return Number.isFinite(ts) ? new Date(ts).toISOString().replace('T', ' ').replace(/\.\d{3}Z$/, ' UTC') : 'unknown';
}

function renderConn() {
  const dot = $('#connDot');
  const txt = $('#connText');
  dot.className = '';
  const badge = $('#connBadge');
  if (state.mode !== 'DERIV') {
    txt.textContent = state.mode === 'DEMO' ? 'DEMO DATA' : 'LOCAL DATA';
    badge.title = 'Local dataset — switch to a Deriv instrument to go live';
    return;
  }
  const store = derivFeed.store;
  const cached = !!(store && store.hasAny());
  const live = state.status === Status.CONNECTED && state.lastTick != null;
  const updatedAt = live ? state.lastTick : (store && store.lastTick && store.lastTick.timestamp) || (store && store.savedAt);
  if (live) {
    dot.classList.add('ok');
    txt.textContent = `LIVE · ${relativeAge(updatedAt)}`;
    badge.title = `Deriv live tick at ${utcLabel(updatedAt)}. Click to reconnect.`;
  } else if (cached) {
    dot.classList.add(state.status === Status.ERROR || state.status === Status.DISCONNECTED ? 'bad' : 'warn');
    txt.textContent = `CACHED · ${relativeAge(updatedAt)}`;
    badge.title = `Showing locally saved candles; last market update ${utcLabel(updatedAt)}. Offline prices cannot update. Click to retry Deriv.`;
  } else if (state.status === Status.CONNECTED) {
    dot.classList.add('warn');
    txt.textContent = 'SYNCING HISTORY…';
    badge.title = 'Connected to Deriv; waiting for candle history.';
  } else if (state.status === Status.CONNECTING || state.status === Status.RECONNECTING) {
    dot.classList.add('warn');
    txt.textContent = state.status === Status.CONNECTING ? 'CONNECTING…' : 'RECONNECTING…';
    badge.title = 'Connecting to Deriv.';
  } else {
    dot.classList.add('bad');
    txt.textContent = state.status === Status.ERROR ? 'OFFLINE · NO CACHE' : 'DISCONNECTED · NO CACHE';
    badge.title = 'No cached candles for this instrument. Connect once to download its history.';
  }
}

/* ---------------- error banner ---------------- */
function renderBanner() {
  const diag = derivSocket.getDiagnostics();
  // Once a connection attempt has failed, keep the banner up through the
  // CONNECTING phase of each retry cycle instead of flickering on/off.
  const connFailed =
    state.mode === 'DERIV' &&
    (state.status === Status.RECONNECTING ||
      state.status === Status.ERROR ||
      (state.status === Status.CONNECTING && diag.lastCloseCode != null));
  let msg = state.error;
  if (!msg) {
    if (diag.cspViolations && diag.cspViolations.length) {
      msg = 'DERIV CONNECTION BLOCKED BY BROWSER SECURITY POLICY (CSP connect-src) — this page host refuses the WebSocket.';
    } else if (diag.lastError && diag.lastCloseCode == null) {
      // e.g. the 15s connect guard firing: the socket hung without any answer.
      msg = `DERIV CONNECTION PROBLEM — ${diag.lastError}. Retrying on ${diag.host}${diag.endpointCount > 1 ? ' and a fallback endpoint' : ''} — click the OFFLINE badge to retry now. Details: open the Data panel.`;
    } else if (diag.lastCloseCode === 1006) {
      // 1006 = the TCP/TLS connection itself never established: something on
      // this machine or network is blocking the endpoint (VPN, firewall, ISP,
      // antivirus). The API never answered, so it is not an app_id problem.
      msg = `DERIV UNREACHABLE — the connection to ${diag.host} failed at the network level (code 1006) after ${diag.attempts || 1} attempt(s). Usually a VPN, firewall, ISP block or antivirus. Rotating endpoints and retrying — click the OFFLINE badge to retry now. Details: open the Data panel.`;
    } else if (diag.lastCloseCode != null) {
      msg = `DERIV CONNECTION FAILED — WebSocket closed (code ${diag.lastCloseCode}${diag.lastCloseReason ? ': ' + diag.lastCloseReason : ''}) on ${diag.host}. Retrying — click the OFFLINE badge to retry now.`;
    } else if (connFailed) {
      msg = 'DERIV CONNECTION FAILED — retrying…';
    }
  }
  const show = !!msg && (state.error || connFailed) && state.mode === 'DERIV';
  $('#banner').hidden = !show;
  $('#bannerMsg').textContent = '⚠ ' + (msg || '');
}

    );

function setTool(id) {
  state.activeTool = id;
  if (canvas) canvas.update({ activeTool: id }); // apply immediately, not on the next rAF
  renderLeftbar();
  syncAll();
}

function toggleMgr() {
  state.mgrOpen = !state.mgrOpen;
  renderDrawMgr();
}

function clearDrawings() {
  if (!state.drawings.length) return;
  pushHistory();
  state.drawings = [];
  state.selectedId = null;
  persistDrawings();
  syncAll();
}

function renderLeftbar() {
  const bar = $('#leftbar');
  bar.classList.toggle('closed', settings.toolbarOpen === false);
  for (const b of bar.children) {
    const role = b.dataset && b.dataset.role;
    if (!role) continue;
    if (role.startsWith('tool-')) b.classList.toggle('active', state.activeTool === role.slice(5));
    else if (role === 'undo') b.classList.toggle('disabled', !state.undoStack.length);
    else if (role === 'redo') b.classList.toggle('disabled', !state.redoStack.length);
    else if (role === 'clear') b.classList.toggle('disabled', !state.drawings.length);
    else if (role === 'manager') {
      b.classList.toggle('active', state.mgrOpen);
      const badgeEl = b.querySelector('.ltbadge');
      if (state.drawings.length && !badgeEl) {
        b.appendChild(el('span', { class: 'ltbadge' }, String(state.drawings.length)));
      } else if (badgeEl) {
        if (state.drawings.length) badgeEl.textContent = String(state.drawings.length);
        else badgeEl.remove();
      }
    } else if (role === 'gridtoggle') b.classList.toggle('active', settings.gridVisible !== false);
  }
}

/* ---------------- drawings manager ---------------- */
const TYPE_LABEL = { trendline: 'Trend Line', vertical: 'Vertical Line', horizontal: 'Horizontal', fibonacci: 'Fibonacci', long_position: 'Long Position', short_position: 'Short Position', rectangle: 'Rectangle', text: 'Text' };
const TYPE_ICON = { trendline: 'slash', vertical: 'vertical', horizontal: 'minus', fibonacci: 'rows', long_position: 'position', short_position: 'position', rectangle: 'square', text: 'pencil' };

function renderDrawMgr() {
  const box = $('#drawMgr');
  box.hidden = !state.mgrOpen;
  const decimals = computeChartData().decimals;
  const rows = state.drawings.map((d) => {
    const pts = d.points || [];
    const label = d.type === 'text'
      ? (d.text || 'Text').split('\n')[0]

        ? formatPrice(pts[0] ? pts[0].price : null, decimals)
        : `${formatPrice(pts[0] ? pts[0].price : null, decimals)} → ${formatPrice(pts[1] ? pts[1].price : null, decimals)}`;
    const selected = d.id === state.selectedId;
    return el('div', { class: 'dmrow' + (selected ? ' sel' : '') },
      el('span', { class: 'ic ' + (d.hidden ? 'off' : 'on'), html: icon(TYPE_ICON[d.type] || 'slash', 14) }),

        el('div', { class: 'dmpts' }, label)
      ),
      el('button', {
        class: 'dmbtn' + (selected ? ' sel' : ''), title: 'Edit (drag points on chart)',

      }),
      el('button', { class: 'dmbtn', title: d.hidden ? 'Show' : 'Hide', html: icon(d.hidden ? 'eyeoff' : 'eye', 13), onclick: () => toggleHideDrawing(d.id) }),
      el('button', { class: 'dmbtn del', title: 'Delete', html: icon('trash', 13), onclick: () => deleteDrawing(d.id) })

function selectDrawing(id) {
  state.selectedId = id;

/* ---------------- drawing style popup ---------------- */
// Floating panel anchored to the selected drawing: color, thickness,
// solid/dashed/dotted line style — and for text drawings, content + font size.
const STYLE_COLORS = ['#4a9eff', '#26a69a', '#ef5350', '#f0b90b', '#ab47bc', '#ff7043', '#22c55e', '#e5e7eb'];
const STYLE_WIDTHS = [1, 2, 3, 4, 6];

function currentDrawing() {
  return state.drawings.find((d) => d.id === state.selectedId) || null;
}

// Style changes must NOT rebuild the popup (that would drop the text input's
// focus): mutate, persist and redraw the canvas only.
function patchDrawingLight(id, patch) {
  state.drawings = state.drawings.map((x) => (x.id === id ? { ...x, ...patch } : x));
  persistDrawings();
  if (canvas) canvas.update({ drawings: state.drawings });
}

function ensureStylePopup() {
  let pop = document.getElementById('stylePop');
  if (!pop) {
    pop = el('div', { id: 'stylePop' });
    $('#stage').appendChild(pop);
  }
  return pop;
}

function buildStylePopContent(d) {
  const dashLabel = { solid: '———', dashed: '– – –', dotted: '· · ·' };
  const pop = el('div');

  pop.appendChild(el('div', { class: 'sprow' },
    ...STYLE_COLORS.map((c) => el('button', {
      class: 'swatch' + ((d.color || DEFAULT_DRAW_COLOR) === c ? ' on' : ''),
      style: 'background:' + c,
      title: c,
      onclick: (e) => {
        patchDrawingLight(d.id, { color: c });
        for (const b of e.currentTarget.parentElement.querySelectorAll('.swatch')) b.classList.toggle('on', b.title === c);
      },
    })),
    el('input', {
      type: 'color', value: /^#[0-9a-fA-F]{6}$/.test(d.color || '') ? d.color : '#4a9eff',
      title: 'Custom color',
      oninput: (e) => patchDrawingLight(d.id, { color: e.target.value }),
    })
  ));

  pop.appendChild(el('div', { class: 'sprow' },
    el('span', { class: 'splabel' }, 'PX'),
    ...STYLE_WIDTHS.map((w) => el('button', {
      class: 'spbtn' + ((d.width || 2) === w ? ' on' : ''),
      onclick: (e) => {
        patchDrawingLight(d.id, { width: w });
        for (const b of e.currentTarget.parentElement.querySelectorAll('.spbtn')) if (/^\d+$/.test(b.textContent)) b.classList.toggle('on', b.textContent === String(w));
      },
    }, String(w))),
    el('span', { class: 'splabel', style: 'margin-left:4px;' }, 'LINE'),
    ...['solid', 'dashed', 'dotted'].map((k) => el('button', {
      class: 'spbtn' + ((d.dash || (d.type === 'horizontal' ? 'dashed' : 'solid')) === k ? ' on' : ''),
      title: k,
      onclick: (e) => {
        patchDrawingLight(d.id, { dash: k });
        for (const b of e.currentTarget.parentElement.querySelectorAll('.spbtn[title]')) b.classList.toggle('on', b.title === k);
      },
    }, dashLabel[k]))
  ));

  if (d.type === 'text') {
    pop.appendChild(el('div', { class: 'sprow' },
      el('span', { class: 'splabel' }, 'SIZE'),
      el('select', { onchange: (e) => patchDrawingLight(d.id, { fontSize: +e.target.value }) },
        ...[10, 12, 14, 18, 22, 28].map((s) => el('option', { value: String(s), selected: (d.fontSize || 14) === s ? '' : null }, s + ' px'))
      ),
      el('input', {
        type: 'text', value: d.text || '', placeholder: 'Type text…',
        oninput: (e) => patchDrawingLight(d.id, { text: e.target.value }),
      })
    ));
  }

  pop.appendChild(el('div', { class: 'sprow' },
    el('button', { class: 'spbtn del', title: 'Delete drawing', onclick: () => deleteDrawing(d.id) }, 'Delete'),
    el('button', { class: 'spbtn', title: 'Close', onclick: () => selectDrawing(null) }, 'Done')
  ));
  return pop;
}

function renderStylePopup() {
  const d = currentDrawing();
  const stage = $('#stage');
  if (!d || !stage) {
    const pop = document.getElementById('stylePop');
    if (pop) pop.remove();
    return;
  }
  const pop = ensureStylePopup();
  if (!stage.contains(pop)) stage.appendChild(pop);
  if (pop.dataset.forId !== d.id) {
    pop.dataset.forId = d.id;
    pop.innerHTML = '';
    pop.appendChild(buildStylePopContent(d));
  }
  if (!canvas || !canvas.drawingAnchorScreen) return;
  const pos = canvas.drawingAnchorScreen(d.id);
  if (!pos) { pop.remove(); return; }
  const pw = pop.offsetWidth || 220;
  const ph = pop.offsetHeight || 90;
  pop.style.left = Math.max(8, Math.min(pos.x - pw / 2, stage.clientWidth - pw - 8)) + 'px';
  pop.style.top = Math.max(8, Math.min(pos.y - ph, stage.clientHeight - ph - 8)) + 'px';
}

// Modal editor shown when a text drawing is placed (and for new text notes).
function openTextEditor(d, isNew) {
  const modal = openModal('');
  const box = modal.querySelector('.modal');
  box.appendChild(mdhead(isNew ? 'Add text' : 'Edit text'));
  const body = el('div', { class: 'mdbody' });
  const input = el('input', { type: 'text', value: d.text || '', placeholder: 'Type the text to show on the chart…' });
  const sizeSel = el('select', {},
    ...[10, 12, 14, 18, 22, 28].map((s) => el('option', { value: String(s), selected: (d.fontSize || 14) === s ? '' : null }, s + ' px'))
  );
  body.appendChild(el('div', { class: 'field' }, el('label', {}, 'Text'), input));
  body.appendChild(el('div', { class: 'field' }, el('label', {}, 'Font size'), sizeSel));
  body.appendChild(el('div', { class: 'field', style: 'display:flex; gap:8px; justify-content:flex-end;' },
    el('button', { class: 'btn', onclick: () => { if (isNew) deleteDrawing(d.id); closeModal(); syncAll(); } }, 'Cancel'),
    el('button', {
      class: 'btn primary',
      onclick: () => {
        const text = input.value.trim();
        if (!text && isNew) { deleteDrawing(d.id); closeModal(); syncAll(); return; }
        patchDrawingLight(d.id, { text: text || d.text || 'Text', fontSize: +sizeSel.value });
        closeModal();
        syncAll();
      },
    }, 'Save')
  ));
  box.appendChild(body);
  setTimeout(() => input.focus(), 30);
}

function toggleHideDrawing(id) {
  pushHistory();
  state.drawings = state.drawings.map((d) => (d.id === id ? { ...d, hidden: !d.hidden } : d));
  persistDrawings();
  syncAll();
}

function deleteDrawing(id) {
  pushHistory();
  state.drawings = state.drawings.filter((d) => d.id !== id);
  if (state.selectedId === id) state.selectedId = null;
  persistDrawings();
  syncAll();
}

/* ---------------- info panel ---------------- */
function initInfoPill() {
  $('#infoPill').addEventListener('click', () => {
    state.infoOpen = !state.infoOpen;
    $('#infoPill').classList.toggle('open', state.infoOpen);
    renderInfoPanel();
  });

function fmtAge(ts) {
  if (ts == null) return '—';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 90) return `${s}s ago`;
  if (s < 5400) return `${Math.round(s / 60)}m ago`;
  if (s < 172800) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function renderInfoPanel(cd, dc) {
  const panel = $('#infoPanel');
  panel.hidden = !state.infoOpen;
  if (!state.infoOpen) return;
  cd = cd || computeChartData();
  dc = dc || displayCandles();
  const tf = getTimeframe(settings.timeframe);
  const lastTs = dc.length ? dc[dc.length - 1].timestamp : null;
  const conn = cd.connection;
  const connCls = conn === 'CONNECTED' ? 'ok' : (conn === 'CONNECTING' || conn === 'RECONNECTING') ? 'warn' : conn === '—' ? '' : 'err';
  const rows = [
    ['SYMBOL', cd.symbol || '—', ''],
    ['CODE', cd.code || '—', ''],
    ['SOURCE', state.replay ? 'REPLAY — ' + cd.source : cd.source, ''],
    ['CONNECTION', conn, connCls],
    ['TIMEFRAME', settings.timeframe, ''],
    ['SOURCE TF', cd.sourceTimeframe || '—', ''],
    ['CONSTRUCTION', cd.construction || '—', ''],
    ['CANDLES', String(dc.length), ''],
    ['FIRST', formatTimestamp(cd.first, tf), ''],
    ['LAST', formatTimestamp(lastTs, tf), ''],
    ['STATUS', state.replay ? (state.replay.playing ? 'REPLAYING' : 'PAUSED') : cd.currentStatus,
      state.replay ? 'warn' : (cd.currentStatus === 'FORMING' ? 'warn' : '')],
    ['GAPS', String(cd.gaps.length), cd.gaps.length ? 'err' : ''],
    ['LAST TICK', `${formatTimestamp(cd.lastTick, tf)} (${fmtAge(cd.lastTick)})`, ''],
  ];
  // Connection diagnostics — how to read a failure at a glance.
  const diag = derivSocket.getDiagnostics();
  const closeDesc = diag.lastCloseCode == null
    ? '—'
    : `code ${diag.lastCloseCode}${diag.lastCloseReason ? ' — ' + diag.lastCloseReason : ''}${diag.lastCloseAt ? ` (${fmtAge(diag.lastCloseAt)})` : ''}`;
  const netHint =
    diag.lastCloseCode === 1006
      ? 'Network-level block — try toggling VPN, firewall or network'
      : diag.lastCloseCode != null && diag.lastCloseCode !== 1000
        ? 'See banner message'
        : '';
  const diagRows = [
    ['ENDPOINT', (diag.host || '—') + (diag.endpointCount > 1 ? ` ${diag.endpointIndex}/${diag.endpointCount}` : ''), ''],
    ['WS URL', diag.endpoint || '—', ''],
    ['ATTEMPTS', String(diag.attempts || 0), (diag.attempts || 0) > 2 ? 'warn' : ''],
    ['LAST CLOSE', closeDesc, diag.lastCloseCode && diag.lastCloseCode !== 1000 ? 'err' : ''],
    ['LAST ERROR', diag.lastError || '—', diag.lastError ? 'warn' : ''],
    ['OPENED', diag.openedAt ? `${fmtAge(diag.openedAt)}` : '—', ''],
    ['MSG AGE', diag.lastMessageAgo != null ? `${Math.round(diag.lastMessageAgo / 1000)}s ago` : '—', ''],
    ['TICKS', diag.tickCount ? `${diag.tickCount} live${diag.lastTickPrice != null ? ` — ${diag.lastTickSymbol || ''} ${diag.lastTickPrice}` : ''}` : '—', diag.tickCount ? 'ok' : ''],
  ];
  if (netHint) diagRows.push(['HINT', netHint, 'warn']);
  panel.innerHTML = '';
  for (const [k, v, cls] of rows.concat(diagRows)) {
    panel.appendChild(el('div', { class: 'iprow' },
      el('span', { class: 'k' }, k),
      el('span', { class: 'v ' + cls }, v)
    ));
  }
  for (const entry of diag.log || []) {
    panel.appendChild(el('div', { class: 'iplog' },
      el('span', { class: 't' }, entry.t),
      el('span', { class: 'l ' + entry.level }, entry.level),
      el('span', { class: 'm' }, entry.msg)
    ));
  }
}

// Status note for the full-asset-list extension (classic v3 gateway).
function auxStatusNote() {
  if (state.auxSymbolsState === 'loading') return 'Loading the full Deriv asset index from the classic gateway…';
  if (state.auxSymbolsState === 'loaded') return `+${state.auxExtraCount} more assets loaded from the classic Deriv gateway.`;
  if (state.auxSymbolsState === 'unreachable') return `Full Deriv symbol gateway unavailable — showing ${state.derivSymbols.length} instruments from the options feed. Symbols not exposed through this feed cannot be quoted here.`;
  if (state.auxSymbolsState === 'none-extra') return 'Asset index complete — the options gateway already serves every listed asset.';
  return null;
}

// Pull the FULL Deriv asset index from the classic v3 gateway and merge it
// into the picker. Best-effort: when that gateway is unreachable the
// options-gateway list stays as-is.
let auxSymbolsStarted = false;
let pickerRefresh = null; // set while the instrument picker modal is open
function extendSymbolsFromAux() {
  if (auxSymbolsStarted) return;
  auxSymbolsStarted = true;
  state.auxSymbolsState = 'loading';
  fetchAuxSymbols().then((aux) => {
    const known = new Set(state.derivSymbols.map((s) => s.code));
    const extra = aux.filter((s) => s.code && !known.has(s.code));
    state.derivSymbols = [...state.derivSymbols, ...extra];
    state.auxSymbolsState = extra.length ? 'loaded' : 'none-extra';
    state.auxExtraCount = extra.length;
  }).catch((e) => {
    state.auxSymbolsState = 'unreachable';
    derivSocket._addLog('warn', 'Classic gateway unreachable — asset list limited to the options gateway (' + e.message + ')');
  }).finally(() => {
    renderMarketPanel();
    if (pickerRefresh) pickerRefresh();
    syncAll();
  });
}

// Group symbols by submarket (display) and order the groups by market family.
function groupSymbols(syms) {
  const groups = new Map();
  for (const s of syms) {
    const g = s.submarketName || s.marketName || 'Other';
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(s);
  }
  const w = (market) => (market === 'synthetic_index' ? 0 : market === 'cryptocurrency' ? 1 : market === 'forex' ? 2 : market === 'indices' ? 3 : market === 'commodities' ? 4 : 5);
  return [...groups.entries()]
    .map(([label, items]) => ({ label, items, market: (items[0] && items[0].market) || '' }))
    .sort((a, b) => (w(a.market) - w(b.market)) || a.label.localeCompare(b.label));
}

function renderMarketList() {
  const list = $('#marketList');

  list.innerHTML = '';

    !q || s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) || (s.marketName || '').toLowerCase().includes(q)

    list.appendChild(el('div', { class: 'mpnone' }, state.derivSymbols.length ? 'No instruments match.' : 'Connect to Deriv to load instruments.'));
    return;

function openSymbolPicker() {
  const modal = openModal('');

  );
  box.appendChild(searchBox);
  let activeFamily = 'all';
  const families = [
    { id: 'all', label: 'All' },
    { id: 'synthetic_index', label: 'Synthetics' },
    { id: 'forex', label: 'Forex' },
    { id: 'cryptocurrency', label: 'Crypto' },
    { id: 'indices', label: 'Indices' },
    { id: 'commodities', label: 'Commodities' },
  ];
  const familyMatches = (s, id) => {
    if (id === 'all') return true;
    const market = `${s.market || ''} ${s.marketName || ''}`.toLowerCase();
    if (id === 'synthetic_index') return s.market === 'synthetic_index' || /synthetic/.test(market);
    if (id === 'forex') return /forex|foreign exchange/.test(market);
    if (id === 'cryptocurrency') return /crypto/.test(market);
    if (id === 'indices') return /index|indices/.test(market) && !/synthetic/.test(market);
    if (id === 'commodities') return /commodit|metals|energy/.test(market);
    return false;
  };
  const filters = el('div', { id: 'symFilters', role: 'group', 'aria-label': 'Filter instruments by market' });
  box.appendChild(filters);
  const renderFilters = (syms) => {
    filters.innerHTML = '';
    for (const family of families) {
      const count = syms.filter((s) => familyMatches(s, family.id)).length;
      filters.appendChild(el('button', {
        type: 'button',
        class: 'symfilter' + (activeFamily === family.id ? ' active' : ''),
        'aria-pressed': String(activeFamily === family.id),
        onclick: () => { activeFamily = family.id; renderFilters(state.derivSymbols); renderList(state.derivSymbols); },
      }, `${family.label} ${count}`));
    }
  };
  const list = el('div', { id: 'symList' });
  box.appendChild(list);

  const renderList = (syms) => {
    list.innerHTML = '';
    const q = (searchBox.querySelector('#symSearch').value || '').trim().toLowerCase();
    const familyItems = syms.filter((s) => familyMatches(s, activeFamily));
    const flt = familyItems.filter((s) => {
      const searchable = [s.name, s.code, s.market, s.marketName, s.submarketName, s.subgroupName].join(' ').toLowerCase();
      return !q || searchable.includes(q);
    });
    if (!flt.length) {
      list.appendChild(el('div', { class: 'symnone' }, familyItems.length ? 'No instruments match.' : (syms.length ? 'No instruments in this market family.' : 'Loading instruments…')));
      return;
    }
    const note = auxStatusNote();
    if (note) list.appendChild(el('div', { class: 'symnote' }, note));
    const noun = activeFamily === 'synthetic_index' ? 'synthetic instruments' : 'instruments';
    list.appendChild(el('div', { class: 'symnote' }, `${flt.length} ${noun} · ${flt.filter((s) => s.open).length} open now`));
    for (const grp of groupSymbols(flt)) {
      list.appendChild(el('div', { class: 'symgroup' }, grp.label,
        el('span', { class: 'gcount' }, String(grp.items.length))));

          onclick: () => { closeModal(); selectSymbol(s); },

    el('button', { class: 'btn', onclick: () => { closeModal(); handleDemo(); } }, icon('play', 13), 'Use DEMO data'),
    el('button', { class: 'btn', onclick: () => { closeModal(); openImportModal(); } }, icon('upload', 13), 'Import CSV'),

function exportCsv() {
  const dc = displayCandles();
  if (!dc.length) return;
  const blob = new Blob([candlesToCsv(dc)], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const cd = computeChartData();
  a.download = `purechart_${(cd.code || cd.symbol || 'data').replace(/[^\w-]+/g, '_')}_${settings.timeframe}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

async function requestPersistentStorage() {
  if (!navigator.storage || !navigator.storage.persisted || !navigator.storage.persist) {
    return { supported: false, persisted: false };
  }
  try {
    let persisted = await navigator.storage.persisted();
    if (!persisted) persisted = await navigator.storage.persist();
    return { supported: true, persisted: !!persisted };
  } catch {
    return { supported: true, persisted: false };
  }
}

function persistentStorageMessage(result) {
  if (!result.supported) return 'This browser does not expose persistent-storage requests; cached data may be evicted.';
  return result.persisted
    ? 'Persistent storage is granted for this site. Browser data can still be removed manually or by profile reset.'
    : 'Persistent storage was not granted. The browser may evict cached data; export a backup regularly.';
}

async function exportOfflineBackup(status) {
  try {
    if (state.mode === 'DERIV' && derivFeed.store) derivFeed.store.flushNow();
    const backup = await Storage.exportBackup(settings);
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `purechart_offline_backup_${new Date().toISOString().replace(/[:.]/g, '-')}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    const count = backup.instruments.reduce((n, item) => n + ((item.history && item.history.m1) || []).length, 0);
    status.textContent = `Backup exported: ${backup.instruments.length} instrument(s), ${count.toLocaleString()} cached 1-minute candles, drawings and settings.`;
  } catch (e) {
    status.textContent = `Backup failed: ${e && e.message ? e.message : 'local storage unavailable'}`;
  }
}
