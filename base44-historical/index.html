<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0e11">
<meta name="description" content="Pure Chart Labs — Deriv charts with offline candle history and drawing tools.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/purechart-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Pure Chart Labs</title>
<style>
  :root, html[data-theme="dark"] {
    --bg: #0b0e11; --panel: #11151b; --panel2: #1a2230; --border: #1f2733;
    --text: #d1d5db; --muted: #8a93a6; --faint: #5f6677;
    --accent: #26a69a; --accent-contrast: #06201d;
    --blue: #4a9eff; --red: #ef5350; --amber: #f0b73e;
    --overlay: rgba(0,0,0,.55);
  }
  html[data-theme="light"] {
    --bg: #ffffff; --panel: #f4f5f7; --panel2: #e9ecf0; --border: #dfe3e8;
    --text: #1f2937; --muted: #5b6472; --faint: #9aa1ad;
    --accent: #0a9e8a; --accent-contrast: #ffffff;
    --blue: #2f7fd6; --red: #e0443f; --amber: #c58a10;
    --overlay: rgba(15,20,30,.35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 1px solid var(--accent); }
  svg.ic { display: block; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- boot overlay ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; background: var(--bg); color: var(--muted);
  }
  #boot .spin {
    width: 32px; height: 32px; border-radius: 50%;
    border: 4px solid var(--panel2); border-top-color: var(--accent);
    animation: pcl-spin 1s linear infinite;
  }
  #boot .bootmsg { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; letter-spacing: .04em; }
  @keyframes pcl-spin { to { transform: rotate(360deg); } }

  /* ---------- app frame ---------- */
  #app { display: flex; flex-direction: column; height: 100vh; }
  #topbar {
    display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 12px 0 12px;
    border-bottom: 1px solid var(--border); flex: none; user-select: none;
  }
  #brand { display: flex; align-items: center; gap: 8px; padding-right: 2px; }
  #brand .mark { color: var(--accent); }
  #brand .b1 { font-weight: 700; font-size: 15px; color: var(--text); }
  #brand .b2 { font-weight: 700; font-size: 15px; color: var(--accent); }

  #symbolBtn {
    display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: 8px;
    border: 1px solid transparent; text-align: left;
  }
  #symbolBtn:hover { background: var(--panel2); border-color: var(--border); }
  #modeBadge {
    flex: none; font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 3px 6px;
    border-radius: 4px; background: color-mix(in srgb, var(--blue) 14%, transparent);
    color: var(--blue); border: 1px solid color-mix(in srgb, var(--blue) 30%, transparent);
  }
  .symtxt { display: flex; flex-direction: column; line-height: 1.15; max-width: 230px; }
  #symName { font-weight: 600; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #symCode { font-size: 10px; color: var(--faint); letter-spacing: .06em; }
  #symbolBtn .chev { color: var(--faint); }

  #tfbar { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  #tfbar::-webkit-scrollbar { display: none; }
  #stylePop { position: absolute; z-index: 40; display: flex; flex-direction: column; gap: 7px; padding: 8px 10px; background: color-mix(in srgb, var(--panel) 96%, transparent); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .4); backdrop-filter: blur(6px); }
  #stylePop .sprow { display: flex; align-items: center; gap: 5px; }
  #stylePop .spbtn { min-width: 22px; height: 22px; padding: 0 6px; display: flex; align-items: center; justify-content: center; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 10.5px; font-weight: 600; cursor: pointer; }
  #stylePop .spbtn:hover { color: var(--text); background: var(--panel2); }
  #stylePop .spbtn.on { border-color: var(--accent); color: var(--accent); }
  #stylePop .spbtn.del:hover { color: var(--red); border-color: var(--red); }
  #stylePop .swatch { width: 18px; height: 18px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; padding: 0; flex: none; }
  #stylePop .swatch.on { border-color: var(--text); }
  #stylePop input[type="color"] { width: 22px; height: 22px; padding: 0; border: 1px solid var(--border); border-radius: 5px; background: transparent; cursor: pointer; flex: none; }
  #stylePop input[type="text"] { flex: 1; min-width: 130px; height: 24px; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 11.5px; padding: 0 6px; outline: none; }
  #stylePop select { height: 24px; background: var(--panel2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-size: 11px; outline: none; }
  #stylePop .splabel { font-size: 9px; font-weight: 700; letter-spacing: .1em; color: var(--faint); flex: none; }
  .gcount { margin-left: auto; font-size: 9.5px; font-weight: 700; color: var(--faint); background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px; line-height: 15px; }
  .mpnote, .symnote { font-size: 10.5px; color: var(--muted); padding: 6px 10px; border: 1px dashed var(--border); border-radius: 8px; margin: 4px 0 8px; }
  .symrow .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: .45; margin-right: 8px; }
  .symrow .dot.open { background: var(--up, #26a69a); opacity: 1; }
  .tfbtn {
    flex: none; min-width: 33px; height: 26px; padding: 0 7px; border-radius: 6px;
    color: var(--muted); font-size: 12px; font-weight: 500; text-align: center;
  }
  .tfbtn:hover { background: var(--panel2); color: var(--text); }
  .tfbtn.active { background: var(--accent); color: var(--accent-contrast); font-weight: 700; }
  .tfbtn.custom { color: var(--accent); }
  .tfdd { position: relative; display: inline-flex; flex: none; }
  .tfddmenu {
    display: none; position: absolute; top: 30px; left: 0; z-index: 40;
    flex-direction: column; gap: 2px; min-width: 64px; padding: 4px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
  }
  .tfddmenu.open { display: flex; }
  .tfddmenu .tfbtn { width: 100%; }
  #tfCustom {
    flex: none; width: 78px; height: 26px; margin-left: 4px; padding: 0 7px;
    border-radius: 6px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); font-size: 11.5px; outline: none;
  }
  #tfCustom:focus { color: var(--text); border-color: var(--accent); }
  #tfCustom.bad { border-color: var(--red, #ef5350); color: var(--red, #ef5350); }

  .tb-spacer { flex: 1; }
  #connBadge { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: .09em; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; flex: none; }
  #connDot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  #connDot.ok { background: #2ecc71; box-shadow: 0 0 0 0 rgba(46,204,113,.5); animation: pcl-pulse 2s infinite; }
  #connDot.warn { background: var(--amber); }
  #connDot.bad { background: var(--red); }
  @keyframes pcl-pulse {
    0% { box-shadow: 0 0 0 0 rgba(46,204,113,.45); }
    70% { box-shadow: 0 0 0 7px rgba(46,204,113,0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
  }
  .tbtn {
    flex: none; display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 9px;
    border-radius: 7px; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap;
  }
  .tbtn:hover { background: var(--panel2); color: var(--text); }
  .tbtn.on { color: var(--accent); }
  .tbtn.icononly { width: 30px; padding: 0; justify-content: center; }

  /* ---------- error banner ---------- */
  #banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 7px 14px; border-bottom: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
    background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red); flex: none;
  }
  #bannerMsg { font-size: 11.5px; }
  .bn-actions { display: flex; gap: 8px; flex: none; }
  .bn-actions button { border-radius: 6px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; }
  #btnRetry { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
  #btnRetry:hover { background: color-mix(in srgb, var(--red) 30%, transparent); }
  #btnUseDemo { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
  #btnUseDemo:hover { background: color-mix(in srgb, var(--amber) 30%, transparent); }

  /* ---------- main row ---------- */
  #mainrow { display: flex; min-height: 0; flex: 1; }
  #leftbar {
    flex: none; width: 46px; border-right: 1px solid var(--border); padding: 6px 0;
    display: flex; flex-direction: column; align-items: center; gap: 2px; user-select: none;
    transition: width .15s ease; overflow: hidden;
  }
  #leftbar.closed { width: 0; padding: 6px 0; border-right-width: 0; }
  .ltbtn {
    width: 34px; height: 34px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: var(--muted); position: relative;
  }
  .ltbtn:hover { background: var(--panel2); color: var(--text); }
  .ltbtn.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .ltbtn.disabled { opacity: .35; pointer-events: none; }
  .ltsep { width: 22px; height: 1px; background: var(--border); margin: 5px 0; flex: none; }
  .ltbadge {
    position: absolute; top: 2px; right: 2px; min-width: 13px; height: 13px; padding: 0 3px;
    border-radius: 7px; background: var(--accent); color: var(--accent-contrast);
    font-size: 8.5px; font-weight: 700; line-height: 13px; text-align: center;
  }

  #stage { position: relative; min-width: 0; flex: 1; overflow: hidden; }
  #chart { position: absolute; inset: 0; display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; outline: none; }

  #zoomctl {
    position: absolute; left: 8px; bottom: 44px; z-index: 10; display: flex; flex-direction: column;
    border-radius: 7px; border: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 94%, transparent);
    box-shadow: 0 4px 14px rgba(0,0,0,.25); overflow: hidden; user-select: none;
  }
  #zoomctl button { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  #zoomctl button:hover { background: var(--panel2); color: var(--text); }
  #zoomctl .zsep { height: 1px; background: var(--border); }

  .overlaypanel {
    position: absolute; z-index: 20; background: color-mix(in srgb, var(--panel) 96%, transparent);
    border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    backdrop-filter: blur(6px);
  }
  #infoPill {
    position: absolute; top: 10px; right: 12px; z-index: 21; display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 94%, transparent); color: var(--muted); font-size: 12px; font-weight: 600;
    backdrop-filter: blur(6px);
  }
  #infoPill:hover { color: var(--text); border-color: var(--muted); }
  #infoPill .chev { transition: transform .15s; }
  #infoPill.open .chev { transform: rotate(180deg); }
  #infoPanel { top: 46px; right: 12px; width: 272px; padding: 4px 0 6px; }
  .iprow { display: flex; justify-content: space-between; gap: 14px; padding: 4.5px 14px; font-size: 11px; }
  .iprow .k { color: var(--faint); letter-spacing: .08em; font-weight: 600; }
  .iprow .v { color: var(--text); text-align: right; max-width: 170px; overflow-wrap: anywhere; }
  .iprow .v.warn { color: var(--amber); }
  .iprow .v.err { color: var(--red); }
  .iprow .v.ok { color: var(--accent); }
  .iplog { display: flex; gap: 7px; padding: 1.5px 14px; font-size: 9.5px; line-height: 1.45; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .iplog .t { color: var(--faint); flex: none; }
  .iplog .l { flex: none; width: 34px; font-weight: 700; }
  .iplog .l.error { color: var(--red); }
  .iplog .l.warn { color: var(--amber); }
  .iplog .l.info { color: var(--accent); }
  .iplog .m { color: var(--muted); overflow-wrap: anywhere; }

  #drawMgr { top: 10px; left: 58px; width: 262px; max-height: 68%; display: flex; flex-direction: column; overflow: hidden; }
  #drawMgr .dmhead { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
  #drawMgr .dmhead .t { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--text); text-transform: uppercase; }
  #drawMgr .dmhead .n { font-size: 10px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; }
  #drawMgr .dmhead button { margin-left: auto; color: var(--muted); }
  #drawMgr .dmhead button:hover { color: var(--text); }
  #drawMgr .dmlist { overflow-y: auto; min-height: 0; }
  .dmrow { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-bottom: 1px solid color-mix(in srgb, var(--border) 60%, transparent); font-size: 11.5px; }
  .dmrow.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .dmrow .ic { flex: none; }
  .dmrow .ic.on { color: var(--blue); } .dmrow .ic.off { color: var(--faint); }
  .dmrow .dmmain { min-width: 0; flex: 1; }
  .dmrow .dmtype { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmrow .dmtype.hidden { color: var(--faint); text-decoration: line-through; }
  .dmrow .dmpts { font-size: 10px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dmrow .dmbtn { flex: none; padding: 3px; border-radius: 5px; color: var(--muted); display: flex; }
  .dmrow .dmbtn:hover { background: var(--panel2); color: var(--text); }
  .dmrow .dmbtn.del:hover { color: var(--red); }
  .dmrow .dmbtn.sel { color: var(--accent); }
  .dmempty { padding: 22px 12px; text-align: center; color: var(--faint); font-size: 11.5px; }

  #marketTab {
    position: absolute; right: 0; top: 42%; z-index: 15; writing-mode: vertical-rl;
    padding: 14px 5px; font-size: 10px; font-weight: 700; letter-spacing: .18em; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border); border-right: 0; border-radius: 8px 0 0 8px;
  }
  #marketTab:hover { color: var(--accent); }
  #marketPanel { top: 10px; right: 12px; bottom: 10px; width: 300px; display: flex; flex-direction: column; overflow: hidden; }
  #marketPanel .mphead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  #marketPanel .mphead .t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #marketPanel .mphead button { margin-left: auto; color: var(--muted); }
  #marketPanel .mphead button:hover { color: var(--text); }
  #marketPanel input {
    margin: 8px 10px; width: calc(100% - 20px); background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; color: var(--text); font-size: 12px;
  }
  #marketPanel .mplist { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 6px; }
  .mpgroup { padding: 8px 12px 3px; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
  .mprow { width: 100%; display: flex; align-items: center; gap: 9px; padding: 6px 12px; text-align: left; }
  .mprow:hover { background: var(--panel2); }
  .mprow.sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .mprow .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--faint); }
  .mprow .dot.open { background: #2ecc71; }
  .mprow .mpmain { min-width: 0; flex: 1; }
  .mprow .mpname { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mprow .mpcode { font-size: 9.5px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; letter-spacing: .05em; }
  .mpnone { padding: 20px; text-align: center; color: var(--faint); font-size: 11.5px; }

  /* ---------- replay ---------- */
  #replayBar {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 22;
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 95%, transparent);
    box-shadow: 0 8px 24px rgba(0,0,0,.35); backdrop-filter: blur(6px); user-select: none; max-width: calc(100% - 24px);
  }
  #replayBar .rpbtn { width: 30px; height: 30px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #replayBar .rpbtn:hover { background: var(--panel2); color: var(--text); }
  #replayBar .rpbtn.play { color: var(--accent); }
  #replayBar .rpcnt { font-size: 11px; color: var(--muted); font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }
  #replayBar .rpohlc { font-size: 11px; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #replayBar .rpohlc .up { color: #2ecc71; } #replayBar .rpohlc .dn { color: var(--red); }
  #replayBar select {
    background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    font-size: 11.5px; padding: 3px 5px;
  }
  #replayBar .rpclose { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  #replayBar .rpclose:hover { background: var(--panel2); color: var(--red); }

  /* ---------- modals ---------- */
  #modalRoot .overlay {
    position: fixed; inset: 0; z-index: 60; background: var(--overlay);
    display: flex; align-items: flex-start; justify-content: center; padding: 7vh 16px 16px;
  }
  .modal {
    width: min(600px, 94vw); max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .modal.wide { width: min(720px, 96vw); }
  .mdhead { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); }
  .mdhead .t { font-size: 13.5px; font-weight: 700; }
  .mdhead .sub { font-size: 11px; color: var(--faint); }
  .mdhead button.x { margin-left: auto; color: var(--muted); display: flex; padding: 4px; border-radius: 6px; }
  .mdhead button.x:hover { background: var(--panel2); color: var(--text); }
  .mdbody { padding: 14px 16px; overflow-y: auto; min-height: 0; }
  .mdfoot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .mdfoot .spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); color: var(--text);
  }
  .btn:hover { background: var(--panel2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.primary:disabled, .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .btn.danger:hover { background: color-mix(in srgb, var(--red) 12%, transparent); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
  .field input[type=text], .field input[type=search], .field input[type=datetime-local], .field select, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 8px 10px; color: var(--text); font-size: 13px;
  }
  .field textarea { min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; resize: vertical; }
  .field .hint { font-size: 10.5px; color: var(--faint); margin-top: 5px; line-height: 1.5; }
  .seg { display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 2px; width: fit-content; }
  .seg button { padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--accent); color: var(--accent-contrast); }

<script>
"use strict";
/* =====================================================================
   PureChart — single-file recreation of the Pure Chart Labs app.
   Ported from the supplied Base44 source handoff:
     src/lib/chart/timeframe.js, candleEngine.js, format.js, themes.js,
     drawings.js, storage.js, demoData.js, csv.js
   ===================================================================== */

/* ---------------- lib/chart/timeframe.js ---------------- */
// Timeframe definitions and deterministic aggregation (UTC-anchored).
const TIMEFRAMES = [
  { label: '1m',  ms: 60 * 1000 },
  { label: '2m',  ms: 120 * 1000 },
  { label: '3m',  ms: 180 * 1000 },
  { label: '5m',  ms: 300 * 1000 },
  { label: '10m', ms: 600 * 1000 },
  { label: '15m', ms: 900 * 1000 },
  { label: '30m', ms: 30 * 60 * 1000 },
  { label: '1H',  ms: 60 * 60 * 1000 },
  { label: '2H',  ms: 2 * 60 * 60 * 1000 },
  { label: '4H',  ms: 4 * 60 * 60 * 1000 },
  { label: '6H',  ms: 6 * 60 * 60 * 1000 },
  { label: '8H',  ms: 8 * 60 * 60 * 1000 },
  { label: '12H', ms: 12 * 60 * 60 * 1000 },
  { label: '1D',  ms: 24 * 60 * 60 * 1000 },
  { label: '1W',  ms: 7 * 24 * 60 * 60 * 1000 },
  { label: '1M',  ms: 30 * 24 * 60 * 60 * 1000 },
  { label: '1.75D', ms: 1.75 * 24 * 60 * 60 * 1000 },
  { label: '2D',  ms: 2 * 24 * 60 * 60 * 1000 },
  { label: '3D',  ms: 3 * 24 * 60 * 60 * 1000 },
  { label: '5D',  ms: 5 * 24 * 60 * 60 * 1000 },
  { label: '7D',  ms: 7 * 24 * 60 * 60 * 1000 },
  { label: '10D', ms: 10 * 24 * 60 * 60 * 1000 },
  { label: '14D', ms: 14 * 24 * 60 * 60 * 1000 },
];

// Multi-day intervals live in a compact picker so the timeframe strip stays
// readable, while remaining first-class timeframes for aggregation.
const MULTI_DAY_TIMEFRAMES = ['1.75D', '2D', '3D', '5D', '7D', '10D', '14D'];
const TOOLBAR_TIMEFRAMES = TIMEFRAMES.filter(
  (t) => !MULTI_DAY_TIMEFRAMES.includes(t.label)
);

function getTimeframe(label) {
  return TIMEFRAMES.find((t) => t.label === label)
    || CUSTOM_TFS.find((t) => t.label === label)
    || TIMEFRAMES[0];
}

// User-added (typable) timeframes — "45m", "3h", "2D"… Registered at boot from
// settings, persisted in localStorage. Sits after the presets so a label like
// "1W" or "1M" typed by the user collapses onto the existing preset.
const CUSTOM_TFS = [];
function registerCustomTf(label, ms) {
  if (!CUSTOM_TFS.some((t) => t.label === label)) CUSTOM_TFS.push({ label, ms });
}
function allTimeframes() { return TIMEFRAMES.concat(CUSTOM_TFS); }

// Parse a user-typed timeframe: "30s", "45m", "3h", "2d", "1w", "1mo".
// Canonical labels: s / m (minute) / H / D / W / M (month = 30d, type "1mo").
// A parsed label that collides with a preset resolves to that preset.
function parseTfInput(str) {
  const m = String(str || '').trim().match(/^(\d+(?:\.\d+)?)\s*(mo|MO|Mo|mO|s|S|m|M|h|H|d|D|w|W)$/);
  if (!m) return null;
  const n = parseFloat(m[1]);
  const rawUnit = m[2];
  const isMonth = rawUnit === 'M' || rawUnit.toLowerCase() === 'mo';
  const unit = isMonth ? 'mo' : rawUnit.toLowerCase();
  if (!isFinite(n) || n <= 0) return null;
  const mult = { s: 1000, m: 60000, h: 3600000, d: 86400000, w: 7 * 86400000, mo: 30 * 86400000 }[unit];
  const ms = Math.round(n * mult);
  if (!isFinite(ms) || ms < 5000 || ms > 366 * 86400000) return null;
  const canon = { s: 's', m: 'm', h: 'H', d: 'D', w: 'W', mo: 'M' }[unit];
  const label = `${n}${canon}`;
  const preset = TIMEFRAMES.find((t) => t.label === label);
  if (preset) return { label: preset.label, ms: preset.ms };
  return { label, ms };
}

// Detect the source timeframe from candle data (most common interval).
function detectSourceTimeframe(candles) {
  if (!candles || candles.length < 3) return null;
  const counts = new Map();
  const limit = Math.min(candles.length, 300);
  for (let i = 1; i < limit; i++) {
    const d = candles[i].timestamp - candles[i - 1].timestamp;
    if (d > 0) counts.set(d, (counts.get(d) || 0) + 1);
  }
  if (!counts.size) return null;
  let best = 0, bestCount = 0;
  for (const [d, c] of counts) {
    if (c > bestCount) { best = d; bestCount = c; }
  }
  let tf = TIMEFRAMES[0], diff = Infinity;
  for (const t of TIMEFRAMES) {
    if (t.label === '1M') continue;
    const dd = Math.abs(t.ms - best);
    if (dd < diff) { diff = dd; tf = t; }
  }
  return tf;
}

function anchorMs(ts, ms) { return Math.floor(ts / ms) * ms; }

function weekAnchor(ts) {
  const d = new Date(ts);
  const day = d.getUTCDay(); // 0 = Sunday
  const diff = day === 0 ? 6 : day - 1;
  d.setUTCDate(d.getUTCDate() - diff);
  d.setUTCHours(0, 0, 0, 0);
  return d.getTime();
}

function monthAnchor(ts) {
  return Date.UTC(new Date(ts).getUTCFullYear(), new Date(ts).getUTCMonth(), 1);
}

function yearAnchor(ts) {
  return Date.UTC(new Date(ts).getUTCFullYear(), 0, 1);
}

function getAnchor(ts, tf) {
  if (tf.label === '1W') return weekAnchor(ts);
  if (tf.label === '1M') return monthAnchor(ts);
  if (tf.label === '1Y') return yearAnchor(ts);
  return anchorMs(ts, tf.ms);
}

// Aggregate candles into a raw timeframe object {label, ms} (used by the local
// history store; same deterministic OHLC rules as aggregate()).
function aggregateByMs(candles, tf) {
  if (!candles || !candles.length) return [];
  const buckets = new Map();
  for (const c of candles) {
    const anchor = getAnchor(c.timestamp, tf);
    let b = buckets.get(anchor);
    if (!b) {
      b = { timestamp: anchor, open: c.open, high: c.high, low: c.low, close: c.close };
      buckets.set(anchor, b);
    } else {
      if (c.high > b.high) b.high = c.high;
      if (c.low < b.low) b.low = c.low;
      b.close = c.close;
    }
  }
  return [...buckets.values()].sort((a, b) => a.timestamp - b.timestamp);
}

// Aggregate lower-timeframe candles into a higher timeframe.
// Deterministic: OPEN=first, HIGH=max, LOW=min, CLOSE=last, anchored to UTC.
function aggregate(candles, targetLabel) {
  if (!candles || !candles.length) return [];
  const source = detectSourceTimeframe(candles);
  const target = getTimeframe(targetLabel);
  if (!source || source.label === target.label || target.ms <= source.ms) {
    return candles.map((c) => ({ ...c }));
  }
  const buckets = new Map();
  for (const c of candles) {
    const anchor = getAnchor(c.timestamp, target);
    let b = buckets.get(anchor);
    if (!b) {
      b = { timestamp: anchor, open: c.open, high: c.high, low: c.low, close: c.close };
      buckets.set(anchor, b);
    } else {
      if (c.high > b.high) b.high = c.high;
      if (c.low < b.low) b.low = c.low;
      b.close = c.close;
    }
  }
  return [...buckets.values()].sort((a, b) => a.timestamp - b.timestamp);
}

/* ---------------- lib/chart/candleEngine.js ---------------- */
// Deriv native candle granularities (seconds). PureChart timeframes not in this
// map are aggregated from a divisor granularity.
const NATIVE_GRANULARITY = {
  '1m': 60, '2m': 120, '3m': 180, '5m': 300, '10m': 600, '15m': 900,
  '30m': 1800, '1H': 3600, '2H': 7200, '4H': 14400, '1D': 86400,
};

// Map a PureChart target timeframe to the Deriv source granularity to fetch.
function sourceForTarget(targetLabel) {
  const tf = getTimeframe(targetLabel);
  const ms = tf.ms;
  // Fetch hints never override the persistent cache. HistStore.layerFor()
  // selects the best populated lower layer and supports non-divisor intervals.
  if (ms < 60000) return { granularity: 60, native: true, sourceLabel: '1m', construction: 'CACHED/TICK FALLBACK' };
  if (ms < 3600000) return { granularity: 60, native: true, sourceLabel: '1m', construction: 'CACHED LOCAL AGGREGATION' };
  if (ms < 86400000) return { granularity: 3600, native: false, sourceLabel: '1H', construction: 'CACHED LOCAL AGGREGATION' };
  return { granularity: 86400, native: false, sourceLabel: '1D', construction: 'CACHED LOCAL AGGREGATION' };
}

class CandleEngine {
  constructor(sourceLabel) {
    this.sourceLabel = sourceLabel;
    this.sourceMs = getTimeframe(sourceLabel).ms;
    this.sourceCandles = []; // {timestamp, open, high, low, close, complete}
    this.rawTicks = [];      // ring buffer of {timestamp, price}
    this.lastTickAt = null;
  }

  // Replace historical source candles (all treated as complete).
  setCandles(candles) {
    this.sourceCandles = (candles || []).map((c) => ({
      timestamp: c.timestamp, open: c.open, high: c.high, low: c.low, close: c.close, complete: true,
    }));
  }

  // Merge historical candles (e.g. on reconnect) without duplicating timestamps.
  // Live forming candles are preserved over stale historical ones.
  mergeCandles(candles) {
    const byTs = new Map();
    for (const c of this.sourceCandles) byTs.set(c.timestamp, c);
    for (const c of candles || []) {
      const ex = byTs.get(c.timestamp);
      if (!ex) byTs.set(c.timestamp, { ...c, complete: true });
      else if (ex.complete === false) {
        /* keep the live forming candle */
      } else {
        byTs.set(c.timestamp, { ...c, complete: true });
      }
    }
    this.sourceCandles = [...byTs.values()].sort((a, b) => a.timestamp - b.timestamp);
  }

  // Ingest a raw tick and update the forming source candle.
  ingestTick(tick) {
    this.rawTicks.push(tick);
    if (this.rawTicks.length > 2000) this.rawTicks.splice(0, this.rawTicks.length - 2000);
    this.lastTickAt = tick.timestamp;

    const anchor = Math.floor(tick.timestamp / this.sourceMs) * this.sourceMs;
    const last = this.sourceCandles[this.sourceCandles.length - 1];

    if (last && last.timestamp === anchor) {
      last.complete = false;
      if (tick.price > last.high) last.high = tick.price;
      if (tick.price < last.low) last.low = tick.price;
      last.close = tick.price;
    } else if (!last || anchor > last.timestamp) {
      if (last && !last.complete) last.complete = true; // previous forming candle has ended
      this.sourceCandles.push({
        timestamp: anchor, open: tick.price, high: tick.price, low: tick.price, close: tick.price, complete: false,
      });
    }
    // anchor < last.timestamp (out-of-order/backfill) is ignored for forming.
  }

  // Aggregate source candles to the target timeframe.
  aggregate(targetLabel) {
    const target = getTimeframe(targetLabel);
    const src = this.sourceCandles;
    if (!src.length) return { candles: [], formingIndex: -1, groups: new Map() };

    // Native: target equals source — return source candles directly.
    if (targetLabel === this.sourceLabel) {
      const candles = src.map((c) => ({ ...c }));
      let formingIndex = -1;
      const li = candles.length - 1;
      if (li >= 0 && !src[li].complete) formingIndex = li;
      const groups = new Map();
      for (let i = 0; i < src.length; i++) groups.set(src[i].timestamp, [i, i]);
      return { candles, formingIndex, groups };
    }
    void target;

    const buckets = new Map();
    for (let i = 0; i < src.length; i++) {
      const c = src[i];
      const anchor = getAnchor(c.timestamp, target);
      let b = buckets.get(anchor);
      if (!b) {
        b = { timestamp: anchor, open: c.open, high: c.high, low: c.low, close: c.close, start: i, end: i };
        buckets.set(anchor, b);
      } else {
        if (c.high > b.high) b.high = c.high;
        if (c.low < b.low) b.low = c.low;
        b.close = c.close;
        b.end = i;
      }
    }
    const arr = [...buckets.values()].sort((a, b) => a.timestamp - b.timestamp);
    const candles = arr.map((b) => {
      // A bucket is forming iff its last source candle is the live forming one.
      const lastSrcForming = !src[b.end].complete;
      return { timestamp: b.timestamp, open: b.open, high: b.high, low: b.low, close: b.close, complete: !lastSrcForming };
    });
    let formingIndex = -1;
    for (let i = candles.length - 1; i >= 0; i--) {
      if (!candles[i].complete) { formingIndex = i; break; }
    }
    const groups = new Map(arr.map((b) => [b.timestamp, [b.start, b.end]]));
    return { candles, formingIndex, groups };
  }

  // Source candles that compose an aggregated candle at `anchor` (verification).
  sourceCandlesFor(anchor, targetLabel) {
    const target = getTimeframe(targetLabel);
    const start = anchor;
    const end = anchor + target.ms;
    return this.sourceCandles.filter((c) => c.timestamp >= start && c.timestamp < end);
  }

  // Detect missing periods in the source series (never manufacture fills).
  detectGaps() {
    const gaps = [];
    for (let i = 1; i < this.sourceCandles.length; i++) {
      const prev = this.sourceCandles[i - 1];
      const cur = this.sourceCandles[i];
      const diff = cur.timestamp - prev.timestamp;
      if (diff > this.sourceMs * 1.5) {
        gaps.push({ start: prev.timestamp + this.sourceMs, end: cur.timestamp, expected: this.sourceMs, actual: diff });
      }
    }
    return gaps;
  }
}

/* ---------------- lib/chart/format.js ---------------- */
const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function guessDecimals(p) {
  const a = Math.abs(Number(p) || 0);
  if (a >= 1000) return 2;
  if (a >= 100) return 3;
  if (a >= 1) return 4;
  if (a >= 0.01) return 5;
  return 8;
}

function formatPrice(p, dec) {
  if (p == null || !isFinite(p)) return '—';
  const d = dec != null ? Math.min(8, Math.max(0, dec)) : guessDecimals(p);
  return Number(p).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}

function p2(n) { return String(n).padStart(2, '0'); }

function formatTimestamp(ts, tf) {
  if (ts == null) return '—';
  const d = new Date(ts);
  const date = `${d.getUTCDate()} ${MONTHS_SHORT[d.getUTCMonth()]} ${d.getUTCFullYear()}`;
  if (!tf || tf.ms >= 24 * 60 * 60 * 1000) return date;
  return `${date} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}

// Time-axis labels: HH:MM within a day, the date on day boundaries.
function formatTimeScale(ts, tf, prevTs) {
  const d = new Date(ts);
  if (tf.ms >= 24 * 60 * 60 * 1000) {
    const y = d.getUTCFullYear() !== new Date(prevTs != null ? prevTs : ts - 1).getUTCFullYear()
      ? ` ${d.getUTCFullYear()}` : '';
    return `${d.getUTCDate()} ${MONTHS_SHORT[d.getUTCMonth()]}${y}`;
  }
  const prev = prevTs != null ? new Date(prevTs) : null;
  const dayChanged = !prev || prev.getUTCDate() !== d.getUTCDate() || prev.getUTCMonth() !== d.getUTCMonth();
  if (dayChanged) return `${d.getUTCDate()} ${MONTHS_SHORT[d.getUTCMonth()]}`;
  return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`;
}

// Derive display decimals from a Deriv pip_size (minimum fluctuation).
function pipDecimals(pip) {
  if (!pip || pip <= 0) return 2;
  return Math.min(8, Math.max(2, Math.round(-Math.log10(pip))));
}

/* ---------------- lib/chart/themes.js ---------------- */
const THEMES = {
  dark: {
    bg: '#0b0e11', scaleBg: '#11151b', grid: '#1a2129', text: '#d1d5db', muted: '#8a93a6',
    bull: '#26a69a', bear: '#ef5350', crosshair: '#758090', border: '#1f2733',
  },

const DrawingDB = {
  NAME: 'purechart-drawings',
  STORE: 'drawings',
  VERSION: 1,
  _p: null,
  open() {
    if (!this._p) {
      this._p = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open(this.NAME, this.VERSION); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains(this.STORE)) req.result.createObjectStore(this.STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('Drawing IndexedDB open failed'));
      });
    }
    return this._p;
  },
  async get(key) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readonly');
      const req = tx.objectStore(this.STORE).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error || new Error('Drawing IndexedDB read failed'));
    });
  },
  async put(key, record) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).put(record, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('Drawing IndexedDB write failed'));
    });
  },
  async exportAll() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readonly');
      const store = tx.objectStore(this.STORE);
      const keys = store.getAllKeys();
      const values = store.getAll();
      tx.oncomplete = () => resolve(keys.result.map((key, i) => ({ key, record: values.result[i] })));
      tx.onerror = () => reject(tx.error || new Error('Drawing backup read failed'));
    });
  },
};

const Storage = {
  settingsKey: 'pcl-settings',
  drawingsKey(key) { return 'pcl-drawings:' + key; },
  datasetKey: 'pcl-dataset',

  loadSettings() {
    try {
      const raw = localStorage.getItem(this.settingsKey);
      return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
  },
  saveSettings(s) {
    try { localStorage.setItem(this.settingsKey, JSON.stringify(s)); } catch { /* quota */ }
  },
  loadDrawingsLegacy(key) {
    if (!key) return [];
    try {
      const raw = localStorage.getItem(this.drawingsKey(key));
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  },
  async loadDrawings(key) {
    if (!key) return [];
    try {
      const record = await DrawingDB.get(key);
      if (record && Array.isArray(record.drawings)) return record.drawings;
    } catch { /* fall back to the legacy mirror */ }
    const legacy = this.loadDrawingsLegacy(key);
    if (legacy.length) {
      DrawingDB.put(key, { drawings: legacy, savedAt: Date.now() }).catch(() => {});
    }
    return legacy;
  },
  async migrateLegacyDrawings() {
    const keys = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('pcl-drawings:')) keys.push(key.slice('pcl-drawings:'.length));
      }
    } catch { return; }
    for (const key of keys) {
      try {
        if (await DrawingDB.get(key)) continue;
        const drawings = this.loadDrawingsLegacy(key);
        if (drawings.length) await DrawingDB.put(key, { drawings, savedAt: Date.now() });
      } catch { /* retain the localStorage copy if IndexedDB is unavailable */ }
    }
  },
  // Persist drawings per instrument so analysis survives page refreshes.
  saveDrawings(key, arr) {
    if (!key) return;
    try { localStorage.setItem(this.drawingsKey(key), JSON.stringify(arr)); } catch { /* legacy fallback quota */ }
    DrawingDB.put(key, { drawings: arr, savedAt: Date.now() }).catch(() => { /* IndexedDB quota / unavailable */ });
  },
  async exportBackup(settings) {
    await this.migrateLegacyDrawings();
    const [instruments, drawingSets] = await Promise.all([HistDB.exportAll(), DrawingDB.exportAll()]);
    const drawingsByKey = new Map(drawingSets.map((item) => [item.key, (item.record && item.record.drawings) || []]));
    return {
      format: 'PureChart Labs offline backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      settings: settings || this.loadSettings(),
      instruments: instruments.map((item) => ({ ...item, drawings: drawingsByKey.get(item.code) || [] })),
      drawingSets,
    };
  },
  saveDataset(ds) {
    try { localStorage.setItem(this.datasetKey, JSON.stringify(ds)); return true; } catch { return false; }
  },
  loadDataset() {
    try {
      const raw = localStorage.getItem(this.datasetKey);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  },
};

// Deterministic pseudo-random walk (mulberry32) so demo charts are stable.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function generateDemoData(symbol, tfLabel) {
  void tfLabel; // raw candles are always 1m; the app aggregates to the target TF
  const rnd = mulberry32(20261112);
  const N = 4320; // three days of 1-minute candles
  const minuteMs = 60 * 1000;
  const nowMin = Math.floor(Date.now() / minuteMs) * minuteMs;
  const startTs = nowMin - (N - 1) * minuteMs;
  let price = 1180 + rnd() * 60;
  const candles = [];
  for (let i = 0; i < N; i++) {
    const open = price;
    let hi = open, lo = open;
    for (let s = 0; s < 4; s++) {
      const drift = (rnd() - 0.5) * 2;
      price = Math.max(50, price * (1 + drift * 0.0009));
      if (price > hi) hi = price;
      if (price < lo) lo = price;
    }
    const round2 = (v) => Math.round(v * 100) / 100;
    candles.push({
      timestamp: startTs + i * minuteMs,
      open: round2(open), high: round2(hi), low: round2(lo), close: round2(price),
    });
  }
  return {
    candles,
    meta: {
      symbol, source: 'DEMO', sourceTimeframe: '1m',
      first: candles[0].timestamp, last: candles[candles.length - 1].timestamp, count: N,
    },
  };
}

// Parse CSV/TSV candle files. Supports: epoch seconds or ms, ISO-8601,
// "YYYY-MM-DD HH:MM[:SS]", "YYYY.MM.DD HH:MM[:SS]", "YYYY/MM/DD HH:MM[:SS]"
// (each optionally split across a date column + time column), with O/H/L/C
// columns by header name or positional order.
function parseCsvText(text) {
  const errors = [];
  const lines = String(text || '').split(/\r?\n/).map((l) => l.trim()).filter((l) => l.length);
  if (lines.length < 2) return { candles: [], stats: null, errors: ['File has fewer than two data rows.'] };

  const sample = lines[0];
  const counts = [[',', (sample.match(/,/g) || []).length], [';', (sample.match(/;/g) || []).length], ['\t', (sample.match(/\t/g) || []).length]];
  counts.sort((a, b) => b[1] - a[1]);
  const delim = counts[0][1] > 0 ? counts[0][0] : ',';

  const rows = lines.map((l) => l.split(delim).map((c) => c.trim().replace(/^"|"$/g, '')));
  const first = rows[0];
  const numLike = (s) => /^-?\d+(\.\d+)?$/.test(s);
  const hasHeader = first.filter((c) => numLike(c)).length < 2;
  const header = hasHeader ? first.map((c) => c.toLowerCase()) : null;
  const dataRows = hasHeader ? rows.slice(1) : rows;

  // Column mapping.
  let dateCol = -1, timeCol = -1, cols = { open: 1, high: 2, low: 3, close: 4 };
  if (header) {
    const find = (...names) => header.findIndex((h) => names.some((n) => h === n || h.startsWith(n)));
    dateCol = find('timestamp', 'date', 'time', 'datetime');
    if (header.some((h) => h === 'date') && header.some((h) => h === 'time')) {
      dateCol = header.findIndex((h) => h === 'date');
      timeCol = header.findIndex((h) => h === 'time');
    }
    const o = find('open', 'o'), h = find('high', 'h'), l = find('low', 'l'), c = find('close', 'c');
    if (o >= 0 && h >= 0 && l >= 0 && c >= 0) cols = { open: o, high: h, low: l, close: c };
    else if (dateCol >= 0) cols = { open: dateCol + 1, high: dateCol + 2, low: dateCol + 3, close: dateCol + 4 };
    else cols = { open: 0, high: 1, low: 2, close: 3 };
  } else {
    dateCol = 0;
    // Two-column leading datetime (e.g. "2024.01.02","00:00"): first cell parses
    // as a date, second as a time, and OHLC follows.
    if (first.length >= 6 && !numLike(first[0]) && /^[\d:]{3,8}$/.test(first[1]) && numLike(first[2])) timeCol = 1;
    const off = timeCol >= 0 ? 2 : 1;
    cols = { open: off, high: off + 1, low: off + 2, close: off + 3 };
  }

  function parseTs(row) {
    const a = row[dateCol >= 0 ? dateCol : 0];
    const b = timeCol >= 0 ? row[timeCol] : null;
    if (a == null) return null;
    // Epoch seconds / milliseconds.
    if (/^\d{10}$/.test(a)) return +a * 1000;
    if (/^\d{13}$/.test(a)) return +a;
    let t = a.replace('T', ' ').replace('Z', '').trim();
    if (b) t = t + ' ' + b;
    let m = t.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    m = t.match(/^(\d{1,2})[-./](\d{1,2})[-./](\d{4})(?:[ ,]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
    if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
    const dt = new Date(a + (b ? ' ' + b : ''));
    return isNaN(dt.getTime()) ? null : dt.getTime();
  }

  const out = [];
  let skipped = 0;
  for (const row of dataRows) {
    const ts = parseTs(row);
    const o = parseFloat(row[cols.open]), h = parseFloat(row[cols.high]);
    const l = parseFloat(row[cols.low]), c = parseFloat(row[cols.close]);
    if (ts == null || !isFinite(o) || !isFinite(h) || !isFinite(l) || !isFinite(c)) { skipped++; continue; }
    out.push({
      timestamp: ts,
      open: o, high: Math.max(o, h, l, c), low: Math.min(o, h, l, c), close: c,
    });
  }
  if (skipped) errors.push(`${skipped} row(s) skipped (unparseable timestamp or price).`);
  out.sort((a, b) => a.timestamp - b.timestamp);
  for (let i = out.length - 2; i >= 0; i--) {
    if (out[i].timestamp === out[i + 1].timestamp) out.splice(i, 1);
  }
  const srcTf = detectSourceTimeframe(out);
  const stats = out.length
    ? { count: out.length, first: out[0].timestamp, last: out[out.length - 1].timestamp, sourceTimeframe: srcTf ? srcTf.label : null }
    : null;
  if (!out.length) errors.push('No usable candle rows found. Expected columns: timestamp/date[, time], open, high, low, close.');
  return { candles: out, stats, errors };
}

function candlesToCsv(candles) {
  const lines = ['timestamp,open,high,low,close'];
  for (const c of candles) {
    lines.push(`${Math.floor(c.timestamp / 1000)},${c.open},${c.high},${c.low},${c.close}`);
  }
  return lines.join('\n');
}
/* =====================================================================
   Deriv data layer — DerivSocket ported from the user's handoff manager
   (src/lib/deriv/derivSocket.js), endpoint corrected and verified live.

   Endpoint facts (probed 2026-11-12, documented at developers.deriv.com):
   - PRIMARY   wss://api.derivws.com/trading/v1/options/ws/public
               Options-API public gateway: read-only market data, no auth/
               OTP/app_id. Speaks the classic message protocol (ping, ticks,
               ticks_history, active_symbols, forget) with small deltas:
                 * ticks_history REQUIRES end ('latest' or epoch string)
                 * count is capped at 1000 per request (silently)
                 * active_symbols takes 'brief'|'full' (not 'all'), no
                   product_type/market params; fields are underlying_symbol,
                   underlying_symbol_name, pip_size, ...
   - FALLBACK  wss://ws.derivws.com/websockets/v3?app_id=1089 (classic v3)
   - ?ws=<url> query param forces a custom endpoint.
   ===================================================================== */

const Status = Object.freeze({
  DISCONNECTED: 'DISCONNECTED',
  CONNECTING: 'CONNECTING',
  CONNECTED: 'CONNECTED',
  RECONNECTING: 'RECONNECTING',
  ERROR: 'ERROR',
});

const RECONNECT_BASE = 1000;
const RECONNECT_MAX = 15000;
const PING_INTERVAL = 30000;
const CONNECT_GUARD = 15000;
const REQUEST_TIMEOUT = 25000;

function derivAppId() {
  try {
    return new URLSearchParams(location.search).get('app_id') || '1089';
  } catch { return '1089'; }
}

function derivWsOverride() {
  try {
    const v = new URLSearchParams(location.search).get('ws');
    return v ? v : null;
  } catch { return null; }
}

// Endpoints tried in rotation until one opens; then it sticks.
function derivEndpoints() {
  const override = derivWsOverride();
  if (override) return [{ url: override, label: 'custom (?ws= override)' }];
  return [
    { url: 'wss://api.derivws.com/trading/v1/options/ws/public', label: 'options-ws-public' },
    { url: `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(derivAppId())}&l=EN&brand=deriv`, label: 'websockets-v3 (app ' + derivAppId() + ')' },
  ];
}

// Aux socket endpoint: the classic v3 gateway serves the FULL Deriv asset
// index (all forex exotics, extra crypto pairs, stock indices…), which the
// options gateway caps at 95. Reachability varies by network; every feature
// that uses it degrades gracefully when it is blocked.
function derivAuxEndpoints() {
  let override = null;
  try { override = new URLSearchParams(location.search).get('ws3'); } catch { /* ignore */ }
  if (override) return [{ url: override, label: 'custom (?ws3= override)' }];
  return [{ url: `wss://ws.derivws.com/websockets/v3?app_id=${encodeURIComponent(derivAppId())}&l=EN&brand=deriv`, label: 'websockets-v3 aux (app ' + derivAppId() + ')' }];
}

class DerivSocket {
  constructor(endpointFn) {
    this._endpointFn = endpointFn || derivEndpoints;
    this.ws = null;
    this.status = Status.DISCONNECTED;
    this.reqId = 1;
    this.pending = new Map();   // req_id -> {resolve, reject, timer}
    this.subs = new Map();      // subscription id -> callback
    this.onStatus = null;       // fn(status)
    this.onReconnect = null;    // fn() — fired after a dropped connection re-opens
    this._everConnected = false;
    this._endpointIdx = 0;
    this._reTimer = null;
    this._connectTimer = null;
    this._pingTimer = null;
    this._cspHandler = null;
    this.shouldRun = false;
    this.reconnectAttempts = 0;
    this.lastMessageAt = 0;

    // Diagnostics state — the UI surfaces this so failures show the REAL reason.
    this.tickCount = 0;
    this.lastTickPrice = null;
    this.lastTickSymbol = null;
    this.openedAt = null;
    this.lastCloseCode = null;
    this.lastCloseReason = null;
    this.lastCloseClean = null;
    this.lastCloseAt = null;
    this.lastError = null;
    this.cspViolations = [];
    this.log = []; // [{t, level, msg}] rolling ring
  }

  get endpoints() { return this._endpointFn(); }

  get endpoint() { return this.endpoints[Math.min(this._endpointIdx, this.endpoints.length - 1)]; }

  _addLog(level, msg) {
    const entry = { t: new Date().toISOString().slice(11, 19), level, msg };
    this.log = [...this.log.slice(-40), entry];
    try { console.log(`[PureChart:DerivSocket:${level}] ${msg}`); } catch { /* ignore */ }
  }

  setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    try { this.onStatus && this.onStatus(s); } catch { /* ignore */ }
  }

  connect() {
    if (this.shouldRun && this.ws && this.ws.readyState <= 1) return;
    this.shouldRun = true;    // Watch for CSP connect-src blocks — some page hosts refuse the socket
    // outright and this is the only signal the browser gives.
    if (!this._cspHandler && typeof document !== 'undefined') {
      this._cspHandler = (e) => {
        if (e.effectiveDirective !== 'connect-src' || !(e.blockedURI || '').includes('derivws.com')) return;
        this.cspViolations = [...this.cspViolations.slice(-10),
          { blockedURI: e.blockedURI, violatedDirective: e.violatedDirective }];
        this._addLog('error', `CSP blocked ${e.blockedURI} (${e.violatedDirective})`);
      };
      document.addEventListener('securitypolicyviolation', this._cspHandler);
    }
    this._open();
  }

  // Resolves once the socket reaches CONNECTED; rejects on ERROR or timeout.
  // Leaves the caller's onStatus handler untouched (chained while waiting).
  waitConnected(timeoutMs) {
    if (this.status === Status.CONNECTED) return Promise.resolve();
    return new Promise((resolve, reject) => {
      const prev = this.onStatus;
      let settled = false;
      const cleanup = () => { clearTimeout(timer); settled = true; this.onStatus = prev; };
      const timer = setTimeout(() => {
        if (settled) return;
        cleanup();
        reject(new Error('Deriv connection timed out'));
      }, timeoutMs || 15000);
      this.onStatus = (s) => {
        try { prev && prev(s); } catch { /* ignore */ }
        if (settled) return;
        if (s === Status.CONNECTED) { cleanup(); resolve(); }
        else if (s === Status.ERROR) { cleanup(); reject(new Error('Deriv connection failed')); }
      };
    });
  }

  _open() {
    if (!this.shouldRun) return;
    clearTimeout(this._reTimer);
    const ep = this.endpoint;
    this.setStatus(this.reconnectAttempts > 0 ? Status.RECONNECTING : Status.CONNECTING);
    this._addLog('info', `Opening WebSocket -> ${ep.url} (attempt ${this.reconnectAttempts + 1})`);
    let ws;
    try {
      ws = new WebSocket(ep.url);
    } catch (e) {
      this.lastError = 'WebSocket constructor threw: ' + (e && e.message ? e.message : String(e));
      this._addLog('error', this.lastError);
      this.setStatus(Status.ERROR);
      this._scheduleReconnect();
      return;
    }
    this.ws = ws;
    // Connect guard: browsers give no feedback while a blocked socket hangs.
    this._connectTimer = setTimeout(() => {
      if (this.ws !== ws || ws.readyState !== 0) return;
      this.lastError = 'Deriv connection timed out';
      this._addLog('error', this.lastError);
      try { ws.close(); } catch { /* ignore */ }
    }, CONNECT_GUARD);

    ws.onopen = () => {
      if (this.ws !== ws || !this.shouldRun) return;
      clearTimeout(this._connectTimer);
      this._everConnected = true;
      this.openedAt = Date.now();
      this.lastMessageAt = 0;
      this.lastError = null;
      this.lastCloseCode = null;
      this.lastCloseReason = null;
      this.lastCloseClean = null;
      this.tickCount = 0;
      this.lastTickPrice = null;
      this.lastTickSymbol = null;
      this.reconnectAttempts = 0;
      this._addLog('info', 'WebSocket OPEN');
      this.setStatus(Status.CONNECTED);
      this._startPing();
      try { this.onReconnect && this.onReconnect(); } catch { /* ignore */ }
    };

    ws.onmessage = (ev) => {
      if (this.ws !== ws || !this.shouldRun) return;
      this.lastMessageAt = Date.now();
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      this._dispatch(msg);
    };

    ws.onerror = () => {
      if (this.ws !== ws || !this.shouldRun) return;
      // Browsers hide cross-origin WS error details; the close event that
      // follows carries the actionable code/reason.
      this.lastError = 'WebSocket error event (browsers omit details for cross-origin WS; see close code)';
      this._addLog('error', 'WebSocket onerror');
    };

    ws.onclose = (ev) => {
      if (this.ws !== ws) return;
      clearTimeout(this._connectTimer);
      this._stopPing();
      this._failPending(new Error('Deriv connection closed'));
      this.lastCloseCode = ev && ev.code;
      this.lastCloseReason = (ev && ev.reason) || '';
      this.lastCloseClean = ev ? ev.wasClean : null;
      this.lastCloseAt = Date.now();
      this.ws = null;
      this._addLog('warn', `WebSocket CLOSED code=${this.lastCloseCode} reason="${this.lastCloseReason || '(none)'}" clean=${this.lastCloseClean}`);
      // While we have never managed to open, rotate through the known
      // endpoints on each failed attempt instead of sticking to one.
      if (!this._everConnected) {
        this._endpointIdx = (this._endpointIdx + 1) % this.endpoints.length;
      }
      if (this.shouldRun) {
        this._scheduleReconnect();
      } else {
        this.setStatus(Status.DISCONNECTED);
      }
    };
  }

  _startPing() {
    this._stopPing();
    const ping = () => {
      const ws = this.ws;
      if (!ws || ws.readyState !== 1) return;
      this.request({ ping: 1 }, 10000).catch((error) => {
        if (this.ws !== ws) return;
        this.lastError = error.message;
        this._addLog('error', `Heartbeat failed: ${error.message}`);
        try { ws.close(); } catch { /* ignore */ }
      });
    };
    ping();
    this._pingTimer = setInterval(ping, PING_INTERVAL);
  }

  _stopPing() {
    if (this._pingTimer) { clearInterval(this._pingTimer); this._pingTimer = null; }
  }

  _scheduleReconnect() {
    this.reconnectAttempts++;
    const wait = Math.min(RECONNECT_MAX, RECONNECT_BASE * Math.pow(2, this.reconnectAttempts - 1));
    this.setStatus(this._everConnected ? Status.RECONNECTING : Status.ERROR);
    this._addLog('info', `Reconnect in ${wait}ms (attempt ${this.reconnectAttempts}, endpoint ${this.endpoint.label})`);
    clearTimeout(this._reTimer);
    this._reTimer = setTimeout(() => this._open(), wait);
  }

  _dispatch(msg) {
    // Tick stream stats for the diagnostics panel.
    if (msg.tick && msg.tick.quote != null && msg.tick.epoch != null) {
      this.tickCount++;
      this.lastTickPrice = Number(msg.tick.quote);
      this.lastTickSymbol = msg.tick.symbol;
    }
    if (msg.active_symbols) this._addLog('info', `Received ${msg.active_symbols.length} active symbols`);

    if (msg.req_id != null) {
      const p = this.pending.get(msg.req_id);
      if (p) {
        if (msg.error) {
          clearTimeout(p.timer);
          this.pending.delete(msg.req_id);
          p.reject(new Error(msg.error.message || msg.error.code || 'request failed'));
        } else if (!msg.subscription) {
          clearTimeout(p.timer);
          this.pending.delete(msg.req_id);
          p.resolve(msg);
        } else {
          // First response of a subscription: resolve, keep pending alive for streams.
          p.resolve(msg);
        }
      }
    }
    if (msg.subscription && msg.subscription.id) {
      const cb = this.subs.get(msg.subscription.id);
      try { cb && cb(msg); } catch { /* ignore handler errors */ }
    }
  }

  _failPending(err) {
    for (const [, p] of this.pending) {
      clearTimeout(p.timer);
      p.reject(err);
    }
    this.pending.clear();
    // Deriv drops subscriptions server-side when the socket dies; drop locally too.
    this.subs.clear();
  }

  // One-shot request returning the full response object.
  send(obj) { return this.request(obj); }

  request(obj, timeoutMs) {
    return new Promise((resolve, reject) => {
      if (!this.ws || this.ws.readyState !== 1) { reject(new Error('Socket not open')); return; }
      const req_id = this.reqId++;
      const timer = setTimeout(() => {
        this.pending.delete(req_id);
        this._addLog('error', `Deriv request timed out (req ${req_id})`);
        reject(new Error('Deriv request timed out'));
      }, timeoutMs || REQUEST_TIMEOUT);
      this.pending.set(req_id, { resolve, reject, timer });
      try {
        this.ws.send(JSON.stringify({ ...obj, req_id }));
      } catch (e) {
        clearTimeout(timer);
        this.pending.delete(req_id);
        reject(e);
      }
    });
  }

  // subscribe({ticks:'R_75'}, cb) -> resolves with the first response.
  async subscribe(payload, cb) {
    const res = await this.request({ ...payload, subscribe: 1 });
    if (res.subscription && res.subscription.id) this.subs.set(res.subscription.id, cb);
    return res;
  }

  async forget(id) {
    if (!id) return;
    this.subs.delete(id);
    try { await this.request({ forget: id }); } catch { /* already gone */ }
  }

  // Snapshot of all diagnostic state for the UI.
  getDiagnostics() {
    const ep = this.endpoint;
    return {
      endpoint: ep.url,
      host: ep.label,
      endpointIndex: this._endpointIdx + 1,
      endpointCount: this.endpoints.length,
      status: this.status,
      attempts: this.reconnectAttempts,
      connectAttempts: this.reconnectAttempts,
      readyState: this.ws ? this.ws.readyState : null, // 0=CONNECTING 1=OPEN 2=CLOSING 3=CLOSED
      openedAt: this.openedAt,
      lastMessageAgo: this.lastMessageAt ? Date.now() - this.lastMessageAt : null,
      lastCloseCode: this.lastCloseCode,
      lastCloseReason: this.lastCloseReason,
      lastCloseClean: this.lastCloseClean,
      lastCloseAt: this.lastCloseAt,
      lastError: this.lastError,
      cspViolations: this.cspViolations,
      pendingRequests: this.pending.size,
      tickCount: this.tickCount,
      lastTickPrice: this.lastTickPrice,
      lastTickSymbol: this.lastTickSymbol,
      appId: derivAppId(),
      log: this.log.slice(-10),
    };
  }

  // Force a fresh connection attempt from the UI.
  forceReconnect() {
    clearTimeout(this._reTimer);
    clearTimeout(this._connectTimer);
    this._failPending(new Error('Deriv connection restarted'));
    this.reconnectAttempts = 0;
    this._endpointIdx = 0;
    if (this.ws) {
      try { this.ws.onclose = null; this.ws.close(); } catch { /* ignore */ }
      this.ws = null;
    }
    this._stopPing();
    this.shouldRun = true;
    this._open();
  }

  disconnect() {
    this.shouldRun = false;
    clearTimeout(this._reTimer);
    clearTimeout(this._connectTimer);
    this._stopPing();
    this._failPending(new Error('Deriv disconnected'));
    if (this.ws) {
      try { this.ws.onclose = null; this.ws.close(); } catch { /* ignore */ }
      this.ws = null;
    }
    if (this._cspHandler && typeof document !== 'undefined') {
      document.removeEventListener('securitypolicyviolation', this._cspHandler);
      this._cspHandler = null;
    }
    this.setStatus(Status.DISCONNECTED);
  }
}

/* ---------------- lib/deriv/derivHistory.js ---------------- */
// The public gateway caps count at 1000 per request. History is therefore
// loaded in phases: one request paints the chart, deeper pages are fetched in
// the background, and if candle requests are refused entirely we fall back to
// building candles from raw tick history so the chart is never blank.
async function fetchCandlesPage(code, granularity, end, count, socket) {
  const res = await (socket || derivSocket).request({
    ticks_history: code,
    adjust_start_time: 1,
    count,
    end,
    start: 1,
    style: 'candles',
    granularity,
  }, 20000);
  if (res.error) throw new Error(res.error.message || res.error.code);
  return (res.candles || []).map((c) => ({
    timestamp: c.epoch * 1000,
    open: +c.open, high: +c.high, low: +c.low, close: +c.close,
  }));
}

async function fetchTickHistory(code, count, socket) {
  const res = await (socket || derivSocket).request({ ticks_history: code, count, end: 'latest', style: 'ticks' }, 20000);
  if (res.error) throw new Error(res.error.message || res.error.code);
  const prices = (res.history && res.history.prices) || [];
  const times = (res.history && res.history.times) || [];
  return times.map((t, i) => ({ timestamp: t * 1000, price: +prices[i] }));
}

function ticksToCandles(ticks, granularitySec) {
  const ms = granularitySec * 1000;
  const buckets = new Map();
  for (const t of ticks || []) {
    const anchor = Math.floor(t.timestamp / ms) * ms;
    const b = buckets.get(anchor);
    if (!b) buckets.set(anchor, { timestamp: anchor, open: t.price, high: t.price, low: t.price, close: t.price });
    else {
      if (t.price > b.high) b.high = t.price;
      if (t.price < b.low) b.low = t.price;
      b.close = t.price;
    }
  }
  return [...buckets.values()].sort((a, b) => a.timestamp - b.timestamp);
}

// Fetch up to `pages` × 1000 candles of one granularity, paginating back from
// 'latest' (dedup + sort). Fills the local history store layers.
async function fetchLayer(code, granularity, pages, socket) {
  let all = [];
  for (let page = 0; page < pages; page++) {
    const end = all.length ? String(Math.floor(all[0].timestamp / 1000) - 1) : 'latest';
    const arr = await fetchCandlesPage(code, granularity, end, 1000, socket);
    if (!arr || !arr.length) break;
    const byTs = new Map(all.map((c) => [c.timestamp, c]));
    for (const c of arr) byTs.set(c.timestamp, c);
    all = [...byTs.values()].sort((a, b) => a.timestamp - b.timestamp);
    if (arr.length < 1000) break; // exchange history exhausted
  }
  return all;
}

/* ---------------- lib/deriv/derivFeed.js ---------------- */
// Deriv data feed orchestrator — MT5-style local history model. On symbol load
// the persistent HistStore is painted immediately (offline capable), the three
// candle layers (1m/1H/1D) + a tick page are refreshed from the gateway when
// online, and one granularity-independent tick subscription is opened. Every
// timeframe switch afterwards is pure local aggregation — no refetch.
class DerivFeed {
  constructor(socket) {
    this.socket = socket;
    this.engine = null;
    this.symbolMeta = null;
    this.targetLabel = null;
    this.store = null;      // HistStore for the loaded symbol
    this.tickSubId = null;
    this.callbacks = null; // { onData, onStatus, onError, onTick }
    this.generation = 0;
  }

  // Route the feed to the socket that can actually serve this symbol: the
  // options gateway for its own list, the classic v3 gateway for symbols that
  // only exist there.
  socketFor(symbolMeta) {
    if (symbolMeta && symbolMeta.source === 'V3') return derivAuxSocket;
    return derivSocket;
  }

  // Load a symbol: paint from the local history cache right away, refresh the
  // layers from the gateway when online, then subscribe to live ticks once.
  async load(symbolMeta, targetLabel, callbacks) {
    const generation = ++this.generation;
    this.callbacks = callbacks || this.callbacks;
    this.symbolMeta = symbolMeta;
    this.targetLabel = targetLabel;
    this.socket = this.socketFor(symbolMeta);
    const store = this.store = new HistStore(symbolMeta.code);

    // 1. Instant paint from the persistent cache — works offline.
    let cached = null;
    try { cached = await HistStore.loadFrom(symbolMeta.code); } catch { /* IDB unavailable */ }
    if (generation !== this.generation) return;
    if (cached && ((cached.m1 && cached.m1.length) || (cached.h1 && cached.h1.length) || (cached.d1 && cached.d1.length))) {
      store.adopt(cached);
      store.rebuildRecentHourlyFromMinutes();
      this._applyStore();
    }

    // 2. Online refresh of every layer + recent ticks. On failure with cached
    // data on screen, keep working offline; without any cache, surface why.
    try {
      this.socket.connect();
      if (this.socket.status !== Status.CONNECTED) await this.socket.waitConnected(15000);
      if (generation !== this.generation) return;
      await this._fillStore(generation);
      if (generation !== this.generation) return;
      this._applyStore();
      store.flushNow();
    } catch (e) {
      if (generation === this.generation && !this.engine) {
        this.callbacks && this.callbacks.onError && this.callbacks.onError(
          'HISTORY UNAVAILABLE OFFLINE — connect once to download this symbol\'s history (' + (e.message || e) + ')');
        return;
      }
      // cached data is on screen; stay offline-capable
    }

    // 3. Live ticks — granularity-independent, survive timeframe switches.
    try {
      await this._subscribeTicks(generation);
    } catch (e) {
      if (generation === this.generation) {
        this.callbacks && this.callbacks.onError && this.callbacks.onError('SYMBOL SUBSCRIPTION FAILED: ' + e.message);
      }
    }
  }

  // Fetch all three candle layers + a page of ticks and merge into the store.
  async _fillStore(generation) {
    const code = this.symbolMeta.code;
    const sock = this.socket;
    // IndexedDB is the primary history source. A recent cache plus the live
    // tick subscription is enough; do not redownload candle pages on every
    // symbol/timeframe open. Stale or empty caches get one small refresh.
    const cacheAge = this.store.savedAt ? Date.now() - this.store.savedAt : Infinity;
    if (this.store.hasAny() && cacheAge >= 0 && cacheAge < 30 * 60 * 1000) return;
    const [m1, h1, d1, ticks] = await Promise.all([
      fetchLayer(code, 60, 1, sock),
     fetchLayer(code, 3600, 1, sock),
     fetchLayer(code, 86400, 1, sock),
      (async () => { try { return await fetchTickHistory(code, 1000, sock); } catch { return []; } })(),
    ]);
    if (generation !== this.generation) return;
    this.store.mergeLayer('m1', m1);
    this.store.mergeLayer('h1', h1);
    this.store.mergeLayer('d1', d1);
    // Ticks last: they freshen every layer's forming tail + the tick ring.
    for (const t of ticks || []) {
      this.store.applyTick({ timestamp: t.timestamp, price: t.price, symbol: code });
    }
    this.store.rebuildRecentHourlyFromMinutes();
  }

  // Derive the target series from the local store and swap in a fresh engine.
  _applyStore() {
    if (!this.store || !this.targetLabel) return;
    const tf = getTimeframe(this.targetLabel);
    const derived = this.store.deriveSeries(tf);
    const engine = this.engine = new CandleEngine(this.targetLabel);
    engine.setCandles(derived.candles);
    if (this.store.lastTick) engine.ingestTick(this.store.lastTick);
    this._emit(derived.layer);
  }

  async _subscribeTicks(generation) {
    const res = await this.socket.subscribe({ ticks: this.symbolMeta.code }, (msg) => {
      if (generation === this.generation) this._onTickMsg(msg);
    });
    const id = (res.subscription && res.subscription.id) || null;
    if (generation !== this.generation) {
      if (id) await this.socket.forget(id);
      return;
    }
    this.tickSubId = id;
  }

  // Switch timeframe: pure local re-aggregation from the history store —
  // never refetches (MT5 "one database, many timeframes").
  retarget(targetLabel) {
    if (!this.symbolMeta || !this.store || !this.store.hasAny()) return;
    this.targetLabel = targetLabel;
    this._applyStore();
  }

  // Reconcile after a reconnect: re-subscribe ticks, refresh the tail of the
  // layer the current timeframe derives from, rebuild locally.
  async reconcile() {
    if (!this.symbolMeta || !this.store || !this.store.hasAny()) return;
    const generation = ++this.generation;
    await this._unsubscribeTicks();
    if (generation !== this.generation) return;
    try {
      await this._subscribeTicks(generation);
    } catch (e) {
      if (generation !== this.generation) return;
      this.callbacks && this.callbacks.onError && this.callbacks.onError('SYMBOL SUBSCRIPTION FAILED: ' + e.message);
    }
    try {
      const code = this.symbolMeta.code;
      const sock = this.socket;
      const safe = (promise) => promise.catch(() => []);
      const [m1, h1, d1, ticks] = await Promise.all([
        safe(fetchLayer(code, 60, 1, sock)),
        safe(fetchLayer(code, 3600, 1, sock)),
        safe(fetchLayer(code, 86400, 1, sock)),
        safe(fetchTickHistory(code, 1000, sock)),
      ]);
      if (generation !== this.generation) return;
      this.store.mergeLayer('m1', m1);
      this.store.mergeLayer('h1', h1);
      this.store.mergeLayer('d1', d1);
      for (const tick of ticks) this.store.applyTick({ ...tick, symbol: code });
      this.store.rebuildRecentHourlyFromMinutes();
      this.store.flushNow();
      this._applyStore();
    } catch { /* best-effort — keep cached history and live subscription */ }
  }

  _onTickMsg(msg) {
    if (msg.error) {
      this.callbacks && this.callbacks.onError && this.callbacks.onError('SYMBOL SUBSCRIPTION FAILED: ' + msg.error.message);
      return;
    }
    const t = msg.tick;
    if (!this.engine || !t || t.quote == null || t.epoch == null || t.symbol !== (this.symbolMeta && this.symbolMeta.code)) return;
    const tick = { timestamp: t.epoch * 1000, price: +t.quote, symbol: t.symbol };
    if (this.store) this.store.applyTick(tick); // refresh every layer tail + tick ring
    this.engine.ingestTick(tick);               // form the live target candle
    this.callbacks && this.callbacks.onTick && this.callbacks.onTick(tick);
    this._emit();
  }

  _emit(layerName) {
    if (!this.engine || !this.callbacks || !this.callbacks.onData) return;
    const agg = this.engine.aggregate(this.targetLabel);
    const layerLabel = layerName === 'ticks' ? 'ticks'
      : layerName === 'm1' ? '1m' : layerName === 'h1' ? '1H' : layerName === 'd1' ? '1D' : null;
    this.callbacks.onData({
      candles: agg.candles,
      formingIndex: agg.formingIndex,
      groups: agg.groups,
      gaps: this.engine.detectGaps(),
      sourceCandles: this.engine.sourceCandles,
      lastTick: this.engine.lastTickAt,
      sourceLabel: layerLabel || this.targetLabel,
      construction: layerName ? 'LOCAL AGGREGATION (' + layerLabel + ' cache)' : 'LOCAL AGGREGATION',
      native: true,
    });
  }

  async _unsubscribeTicks() {
    const id = this.tickSubId;
    this.tickSubId = null;
    if (id) await this.socket.forget(id);
  }

  async unload() {
    ++this.generation;
    this.engine = null;
    this.symbolMeta = null;
    this.store = null;
    await this._unsubscribeTicks();
  }
}

const derivFeed = new DerivFeed(derivSocket);
/* =====================================================================
   lib/deriv/historyStore.js — MT5-style local history database.

   One IndexedDB record per symbol holding three candle layers (1m, 1H, 1D)
   plus a recent tick ring. Every chart timeframe is derived locally by pure
   bucket math (aggregateByMs / ticksToCandles), so switching timeframes NEVER
   refetches, and a cached symbol keeps working fully offline.
   ===================================================================== */
const HistDB = {
  NAME: 'purechart-hist',
  STORE: 'symbols',
  VERSION: 1,
  _p: null,
  open() {
    if (!this._p) {
      this._p = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open(this.NAME, this.VERSION); } catch (e) { reject(e); return; }
        req.onupgradeneeded = () => { try { req.result.createObjectStore(this.STORE); } catch { /* exists */ } };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
      });
    }
    return this._p;
  },
  async get(code) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readonly');
      const rq = tx.objectStore(this.STORE).get(code);
      rq.onsuccess = () => resolve(rq.result || null);
      rq.onerror = () => reject(rq.error || new Error('IndexedDB get failed'));
    });
  },
  async put(code, rec) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readwrite');
      tx.objectStore(this.STORE).put(rec, code);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('IndexedDB put failed'));
    });
  },
  async exportAll() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(this.STORE, 'readonly');
      const symbols = tx.objectStore(this.STORE);
      const symbolKeys = symbols.getAllKeys();
      const symbolValues = symbols.getAll();
      tx.oncomplete = () => {
        resolve(symbolKeys.result.map((code, i) => ({
          code,
          history: symbolValues.result[i] || null,
        })));
      };
      tx.onerror = () => reject(tx.error || new Error('IndexedDB backup read failed'));
    });
  },
};

const HIST_LAYER_CAP = 12000;  // lower-timeframe cache retained for local aggregation
const HIST_TICK_CAP = 4000;    // max cached ticks (sub-minute timeframes)

class HistStore {
  constructor(code) {
    this.code = code;
    this.m1 = [];     // 1-minute layer {timestamp, open, high, low, close}
    this.h1 = [];     // 1-hour layer
    this.d1 = [];     // 1-day layer
    this.ticks = [];  // recent raw ticks {timestamp, price} — sub-minute TFs
    this.lastTick = null;
    this.savedAt = null;
    this._saveTimer = null;
  }

  hasAny() { return !!(this.m1.length || this.h1.length || this.d1.length); }

  adopt(rec) {
    if (!rec) return;
    const arr = (a) => (Array.isArray(a) ? a : []);
    this.m1 = arr(rec.m1); this.h1 = arr(rec.h1); this.d1 = arr(rec.d1);
    this.ticks = arr(rec.ticks).slice(-HIST_TICK_CAP);
    this.lastTick = rec.lastTick || null;
    this.savedAt = Number.isFinite(rec.savedAt) ? rec.savedAt : null;
  }

  serialize() {
    return { m1: this.m1, h1: this.h1, d1: this.d1, ticks: this.ticks, lastTick: this.lastTick, savedAt: this.savedAt || Date.now() };
  }

  static async loadFrom(code) {
    try { return await HistDB.get(code); } catch { return null; } // IDB unavailable / private mode
  }

  // Debounced persistence — safe to call on every tick.
  persist() {
    clearTimeout(this._saveTimer);
